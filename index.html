      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── PELÍCULAS ── */
    function sortKey(peli, fallback) {
      return plainTitle(peli, fallback).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function initialLetter(peli, fallback) {
      const ch = sortKey(peli, fallback).charAt(0).toUpperCase();
      return /[A-Z]/.test(ch) ? ch : '#';
    }

    // Estado de la vista de películas, para que sobreviva a los re-render.
    const peliView = { orden: 'titulo', genero: '', letra: 'all', texto: '', vista: 'lista' };

    function renderPeliculas() {
      const films = allFilmEntries();

      const generos = {};
      for (const f of films) for (const g of genresOf(f.peli)) generos[g] = (generos[g] || 0) + 1;
      const generosOrdenados = Object.entries(generos).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es'));

      document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Películas <span style="font-family:var(--ff-display);font-style:italic;font-size:.5em;color:var(--tx-3)">${films.length}</span></h1>
        <div class="page-sub">Cada película una vez, aunque la trajeran varios.</div>

        <div class="toolbar">
          <div class="field filter-input">
            <div class="control">
              <input class="input" type="search" id="peli-search" placeholder="Filtrar por título, director…" value="${peliView.texto}">
            </div>
          </div>
          <div class="select-wrap">
            <select id="peli-genero" aria-label="Filtrar por género">
              <option value="">Todos los géneros</option>
              ${generosOrdenados.map(([g, n]) => `<option value="${g}"${peliView.genero === g ? ' selected' : ''}>${g} (${n})</option>`).join('')}
            </select>
          </div>
          <div class="select-wrap">
            <select id="peli-orden" aria-label="Ordenar">
              <option value="titulo">A · Z</option>
              <option value="year-asc">Más antiguas</option>
              <option value="year-desc">Más recientes</option>
              <option value="rating">Mejor valoradas</option>
              <option value="duracion">Más largas</option>
            </select>
          </div>
          <div class="toolbar-spacer"></div>
          <div class="segmented" id="peli-vista">
            <button data-vista="lista">Lista</button>
            <button data-vista="rejilla">Rejilla</button>
          </div>
        </div>

        <div class="alpha-nav" id="alpha-nav"></div>
        <div id="films-list"></div>
      </div></section>`;

      document.getElementById('peli-orden').value = peliView.orden;
      document.querySelectorAll('#peli-vista button').forEach(b =>
        b.classList.toggle('is-active', b.dataset.vista === peliView.vista));

      const paint = () => paintPeliculas(films);
      paint();

      const search = document.getElementById('peli-search');
      let t;
      search.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => { peliView.texto = search.value; peliView.letra = 'all'; paint(); }, 120);
      });
      document.getElementById('peli-genero').addEventListener('change', e => {
        peliView.genero = e.target.value; peliView.letra = 'all'; paint();
      });
      document.getElementById('peli-orden').addEventListener('change', e => {
        peliView.orden = e.target.value; peliView.letra = 'all'; paint();
      });
      document.querySelectorAll('#peli-vista button').forEach(btn => {
        btn.addEventListener('click', () => {
          peliView.vista = btn.dataset.vista;
          document.querySelectorAll('#peli-vista button').forEach(b =>
            b.classList.toggle('is-active', b === btn));
          paint();
        });
      });
    }

    function filterFilms(films) {
      const q = normalize(peliView.texto.trim());
      return films.filter(f => {
        if (peliView.genero && !genresOf(f.peli).includes(peliView.genero)) return false;
        if (peliView.letra !== 'all' && initialLetter(f.peli, f.titulo) !== peliView.letra) return false;
        if (!q) return true;
        const p = f.peli;
        const haystack = [f.titulo, p && p.titulo_original, p && p.titulo_es, p && p.director, p && p.year]
          .filter(Boolean).join(' ');
        return normalize(haystack).includes(q);
      });
    }

    function sortFilms(films) {
      const num = (v, def) => { const n = parseFloat(v); return isNaN(n) ? def : n; };
      const byTitle = (a, b) => sortKey(a.peli, a.titulo).localeCompare(sortKey(b.peli, b.titulo), 'es');
      switch (peliView.orden) {
        case 'year-asc':  return films.sort((a, b) => num(a.peli && a.peli.year, 9999) - num(b.peli && b.peli.year, 9999) || byTitle(a, b));
        case 'year-desc': return films.sort((a, b) => num(b.peli && b.peli.year, 0) - num(a.peli && a.peli.year, 0) || byTitle(a, b));
        case 'rating':    return films.sort((a, b) => num(b.peli && b.peli.tmdb_rating, -1) - num(a.peli && a.peli.tmdb_rating, -1) || byTitle(a, b));
        case 'duracion':  return films.sort((a, b) => num(b.peli && b.peli.runtime, -1) - num(a.peli && a.peli.runtime, -1) || byTitle(a, b));
        default:          return films.sort(byTitle);
      }
    }

    function paintPeliculas(allFilms) {
      const alphaNav = document.getElementById('alpha-nav');
      const list = document.getElementById('films-list');
      const alfabetico = peliView.orden === 'titulo';

      // La barra A-Z se calcula sobre el conjunto filtrado por texto/género,
      // no por letra: si no, elegir una letra vaciaría la propia barra.
      const letraPrevia = peliView.letra;
      peliView.letra = 'all';
      const sinLetra = filterFilms(allFilms);
      peliView.letra = letraPrevia;

      if (alfabetico) {
        const counts = {};
        for (const f of sinLetra) {
          const l = initialLetter(f.peli, f.titulo);
          counts[l] = (counts[l] || 0) + 1;
        }
        const letras = Object.keys(counts).sort();
        if (letraPrevia !== 'all' && !counts[letraPrevia]) peliView.letra = 'all';
        alphaNav.style.display = '';
        alphaNav.innerHTML = `<button class="alpha-pill${peliView.letra === 'all' ? ' is-active' : ''}" data-letter="all">Todos</button>`
          + letras.map(l => `<button class="alpha-pill${peliView.letra === l ? ' is-active' : ''}" data-letter="${l}">${l}</button>`).join('');
        alphaNav.querySelectorAll('.alpha-pill').forEach(btn => {
          btn.addEventListener('click', () => { peliView.letra = btn.dataset.letter; paintPeliculas(allFilms); });
        });
      } else {
        peliView.letra = 'all';
        alphaNav.style.display = 'none';
        alphaNav.innerHTML = '';
      }

      const films = sortFilms(filterFilms(allFilms));

      if (!films.length) {
        list.innerHTML = `<div class="empty-state">
          <div class="empty-icon">${ico('buscar')}</div>
          <div class="empty-title">Ninguna película encaja</div>
          <p>Prueba con otro título o quita algún filtro.</p>
        </div>`;
        return;
      }

      let html = `<div class="result-count mb-3">${films.length} película${films.length !== 1 ? 's' : ''}</div>`;

      if (peliView.vista === 'rejilla') {
        html += `<div class="poster-grid stagger">`;
        for (const [i, f] of films.entries()) {
          const anio = f.peli && f.peli.year ? f.peli.year : '';
          const quien = subLineFor(f);
          html += posterTile(f.slug, f.peli, [anio, quien].filter(Boolean).join(' · '), Math.min(i, 24));
        }
        html += `</div>`;
      } else {
        const porLetra = {};
        if (alfabetico) for (const f of films) {
          const l = initialLetter(f.peli, f.titulo);
          porLetra[l] = (porLetra[l] || 0) + 1;
        }
        let letraActual = '';
        for (const f of films) {
          if (alfabetico) {
            const l = initialLetter(f.peli, f.titulo);
            if (l !== letraActual) {
              letraActual = l;
              html += `<div class="alpha-heading" id="letter-${l}">${l} <span class="decade-count">${porLetra[l]}</span></div>`;
            }
          }
          const url = posterUrl(f.peli && f.peli.poster, POSTER.xs);
          const poster = url
            ? `<img class="film-poster-sm" src="${url}" alt="" loading="lazy">`
            : posterPh(plainTitle(f.peli, f.titulo), 'film-poster-ph');
          html += `<div class="film-row">
            ${poster}
            <div class="film-row-body">
              <div class="film-row-title"><a href="#pelicula/${f.slug}">${filmTitle(f.peli, f.titulo)}${f.peli && f.peli.year ? ` (${f.peli.year})` : ''}</a></div>
              <div class="film-row-sub">${subLineFor(f, true)}</div>
            </div>
          </div>`;
        }
      }
      list.innerHTML = html;
    }

    // Línea secundaria: quién la trajo y en qué finde (+ director en lista).
    function subLineFor(f, conDirector) {
      const apps = appearancesOf(f.slug);
      const quien = apps.map(a =>
        `<a href="#persona/${encodeURIComponent(a.persona)}">${a.persona}</a> · <a href="#finde/${a.finde.numero}">#${a.finde.numero}</a>`
      ).join(' / ');
      if (!conDirector) return apps.map(a => a.persona).join(' / ');
      const dir = f.peli && f.peli.director ? `${f.peli.director} — ` : '';
      return dir + quien;
    }

    /* ── PELÍCULA DETAIL ── */
    async function renderPelicula(slug) {
      const peli = await loadPeli(slug);
      if (!peli) { notFound('esa película', '#peliculas', 'Ver todas las películas'); return; }

      const appearances = [];
      for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
        if (typeof m !== 'string' && m.slug === slug) appearances.push({ finde: f, persona: p.nombre });
      }

      const orig = peli.titulo_original || peli.titulo;
      const es = peli.titulo_es || peli.titulo;
      const displayTitle = orig.toLowerCase() === es.toLowerCase()
        ? orig : `${orig} <span class="peli-es">(${es})</span>`;

      // Find other films by same director(s)
      const directorFilms = {};
      if (peli.director) {
        for (const d of peli.director.split(', ')) {
          directorFilms[d] = [];
          for (const [s, p] of Object.entries(PELI_CACHE)) {
            if (p && s !== slug && p.director && p.director.split(', ').includes(d)) {
              directorFilms[d].push({ slug: s, peli: p });
            }
          }
        }
      }

      // Find films from the same genre
      const genres = peli.genre ? peli.genre.split(', ').map(g => g.trim()) : [];
      const genreFilms = [];
      if (genres.length) {
        const primaryGenre = genres[0];
        for (const [s, p] of Object.entries(PELI_CACHE)) {
          if (p && s !== slug && p.genre && p.genre.includes(primaryGenre)) {
            const shared = genres.filter(g => p.genre.includes(g)).length;
            genreFilms.push({ slug: s, peli: p, shared });
          }
        }
        genreFilms.sort((a, b) => b.shared - a.shared);
      }

      // Find films from the same year
      const yearFilms = [];
      if (peli.year) {
        for (const [s, p] of Object.entries(PELI_CACHE)) {
          if (p && s !== slug && p.year === peli.year) yearFilms.push({ slug: s, peli: p });
        }
      }

      let html = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#peliculas', label:'Películas'}, {href:'#', label: orig}])}

        <div class="columns">
          <div class="column is-narrow" style="text-align:center">
      `;
      if (peli.poster) {
        html += `<img class="peli-poster-img" src="${posterUrl(peli.poster, POSTER.lg)}" alt="Cartel de ${peli.titulo}">`;
      }

      html += `</div><div class="column">
        <h1 class="peli-title">${displayTitle}</h1>
      `;

      // ── Year (linked to same-year films)
      if (peli.year) {
        const yearNote = yearFilms.length ? ` <span style="font-size:.78rem;font-style:normal;font-family:var(--ff-body);color:var(--tx-3)">(${yearFilms.length} más de este año)</span>` : '';
        html += `<div style="font-family:var(--ff-display);font-style:italic;font-size:1.2rem;color:var(--tx-2);margin-bottom:.5rem">${peli.year}${yearNote}</div>`;
      }

      // ── Director (navigable link)
      if (peli.director) {
        const dirLinks = peli.director.split(', ').map(d =>
          `<a href="#director/${encodeURIComponent(d)}" style="color:var(--wine);text-decoration:none;font-weight:500">${d}</a>`
        ).join(', ');
        html += `<div class="peli-line">${ico('camara')} ${dirLinks}</div>`;
      }

      // ── Runtime
      if (peli.runtime) {
        html += `<div class="peli-line peli-line-muted">${ico('reloj')} ${peli.runtime}</div>`;
      }

      // ── Genres (navigable tags)
      if (genres.length) {
        html += `<div class="tags mb-3">${genres.map(g =>
          `<a class="tag is-genre" href="#genero/${encodeURIComponent(g)}">${g}</a>`
        ).join('')}</div>`;
      }

      // ── Ratings
      if (peli.imdb_id || peli.tmdb_id || peli.tmdb_rating) {
        html += `<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem">`;
        if (peli.tmdb_rating) {
          html += `<span class="peli-rating" style="cursor:default">${ico('estrella','class="ico ico-estrella"')} ${fmtRating(peli.tmdb_rating)} / 10</span>`;
        }
        if (peli.imdb_id) {
          html += `<a class="peli-rating" href="https://www.imdb.com/title/${peli.imdb_id}" target="_blank" rel="noopener" style="background:var(--gold-bg);color:var(--gold)">IMDb ↗</a>`;
        }
        if (peli.tmdb_id) {
          html += `<a class="peli-rating" href="https://www.themoviedb.org/movie/${peli.tmdb_id}" target="_blank" rel="noopener" style="background:var(--bg-inset);color:var(--tx-2)">TMDB ↗</a>`;
        }
        html += `</div>`;
      }

      // ── Plot
      if (peli.plot) {
        html += `<article class="message is-wine mt-4"><div class="message-body">${peli.plot}</div></article>`;
      }

      // ── Traída por / En los Findes
      html += `<h2 style="font-family:var(--ff-display);font-size:1.15rem;margin-top:1.5rem;margin-bottom:.75rem">En los Findes</h2>`;
      html += `<div class="stagger">`;
      for (const [i, a] of appearances.entries()) {
        html += `<div class="card mb-3" style="--i:${i}">
          <div class="card-content" style="display:flex;align-items:center;gap:.85rem;overflow:visible">
            <div class="persona-avatar" style="width:38px;height:38px;font-size:.95rem">${a.persona.charAt(0)}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:.9rem">
                Traída por <a href="#persona/${encodeURIComponent(a.persona)}">${a.persona}</a>
              </div>
              <div style="font-size:.78rem;color:var(--tx-3)">
                <a href="#finde/${a.finde.numero}" style="color:var(--tx-3)">Finde #${a.finde.numero}</a>
                · <span style="font-family:var(--ff-display);font-style:italic">${a.finde.fecha}</span>
                · ${a.finde.lugares.map(l => `<a href="#lugar/${encodeURIComponent(l)}" style="color:var(--tx-3)">${l}</a>`).join(', ')}
              </div>
            </div>
          </div>
        </div>`;
      }
      html += `</div>`;

      // ── Más del mismo director, mismo año y mismo género.
      //    Cada bloque excluye lo ya mostrado arriba para no repetir carteles.
      const yaMostrado = new Set([slug]);

      for (const [director, films] of Object.entries(directorFilms)) {
        const nuevas = films.filter(f => !yaMostrado.has(f.slug));
        if (!nuevas.length) continue;
        const visibles = nuevas.slice(0, 6);
        visibles.forEach(f => yaMostrado.add(f.slug));
        html += relatedGrid(
          `Más de <a href="#director/${encodeURIComponent(director)}">${director}</a>`,
          visibles,
          f => f.peli.year || '',
          nuevas.length > 6 ? `<a href="#director/${encodeURIComponent(director)}">Ver las ${films.length} películas →</a>` : ''
        );
      }

      const yearNuevas = yearFilms.filter(f => !yaMostrado.has(f.slug));
      if (yearNuevas.length) {
        const visibles = yearNuevas.slice(0, 6);
        visibles.forEach(f => yaMostrado.add(f.slug));
        html += relatedGrid(
          `También de ${peli.year}`,
          visibles,
          f => f.peli.director || '',
          yearNuevas.length > 6 ? `<span style="color:var(--tx-3)">y ${yearNuevas.length - 6} más del mismo año</span>` : ''
        );
      }

      const generoNuevas = genreFilms.filter(f => !yaMostrado.has(f.slug));
      if (generoNuevas.length) {
        html += relatedGrid(
          genres.length ? `Más <a href="#genero/${encodeURIComponent(genres[0])}">${genres[0].toLowerCase()}</a>` : 'Mismo género',
          generoNuevas.slice(0, 6),
          f => `${f.peli.director || ''}${f.peli.year ? ` · ${f.peli.year}` : ''}`,
          ''
        );
      }

      html += `</div></div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── LUGARES ── */
    function renderLugares() {
      const lugarStats = {};
      for (const f of DATA) for (const l of f.lugares) {
        if (!lugarStats[l]) lugarStats[l] = { findes: 0, pelis: 0 };
        lugarStats[l].findes += 1;
        lugarStats[l].pelis += f.personas.reduce((s, p) => s + p.peliculas.length, 0);
      }

      let html = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Lugares</h1>
        <div class="stagger">
      `;
      const sorted = Object.entries(lugarStats).sort((a, b) => b[1].findes - a[1].findes);
      for (const [i, [name, s]] of sorted.entries()) {
        html += `<a href="#lugar/${encodeURIComponent(name)}" class="archive-row" style="--i:${i}">
          <span class="ar-num ar-ico">${ico('lugar')}</span>
          <span class="ar-body">
            <span class="ar-date">${name}</span>
            <span class="ar-place">${s.findes} findes · ${s.pelis} películas</span>
          </span>
          <span class="ar-count">${s.findes} ${s.findes === 1 ? 'finde' : 'findes'}</span>
        </a>`;
      }
      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── LUGAR DETAIL ── */
    function renderLugar(nombre) {
      const findes = DATA.filter(f => f.lugares.includes(nombre));
      const totalPelis = findes.reduce((s, f) => s + f.personas.reduce((sp, p) => sp + p.peliculas.length, 0), 0);

      let html = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#lugares', label:'Lugares'}, {href:'#', label: nombre}])}

        <h1 class="page-heading">${nombre}</h1>
        <div class="page-sub">${findes.length} findes · ${totalPelis} películas</div>

        <div class="stagger">
      `;
      for (const [i, f] of findes.entries()) {
        const npelis = f.personas.reduce((s, p) => s + p.peliculas.length, 0);
        const participantes = f.personas.map(p =>
          `<a href="#persona/${encodeURIComponent(p.nombre)}" style="color:var(--tx-2)">${p.nombre}</a>`
        ).join(', ');
        html += `<a href="#finde/${f.numero}" class="archive-row" style="--i:${i}">
          <span class="ar-num">${f.numero}</span>
          <span class="ar-body">
            <span class="ar-date">${f.fecha || '—'}</span>
            <span class="ar-place ar-clip">${f.personas.map(p=>p.nombre).join(', ')}</span>
          </span>
          <span class="ar-count">${npelis} películas</span>
        </a>`;
      }
      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── DIRECTORES ── */
    function getDirectorStats() {
      const directors = {};
      for (const [slug, peli] of Object.entries(PELI_CACHE)) {
        if (!peli || !peli.director) continue;
        for (const d of peli.director.split(', ')) {
          if (!directors[d]) directors[d] = { films: [], findes: new Set(), poster: null };
          directors[d].films.push({ slug, peli });
          if (!directors[d].poster && peli.poster) directors[d].poster = peli.poster;
          if (peli.findes) peli.findes.forEach(n => directors[d].findes.add(n));
        }
      }
      return directors;
    }

    function renderDirectores() {
      const directors = getDirectorStats();
      const sorted = Object.entries(directors).sort((a, b) => b[1].films.length - a[1].films.length);

      let html = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Directores</h1>
        <div class="page-sub">${sorted.length} directores en el archivo</div>

        <div class="field filter-input" style="max-width:360px;margin-bottom:1.5rem">
          <div class="control">
            <input class="input" type="search" id="director-search" placeholder="Filtrar por nombre...">
          </div>
        </div>

        <div class="stagger" id="directors-list">
      `;
      for (const [i, [name, stats]] of sorted.entries()) {
        const topFilms = stats.films.slice(0, 3).map(f => {
          const t = f.peli.titulo_original || f.peli.titulo;
          const yr = f.peli.year ? ` (${f.peli.year})` : '';
          return t + yr;
        }).join(', ');
        const extra = stats.films.length > 3 ? `… y ${stats.films.length - 3} más` : '';
        html += `<a href="#director/${encodeURIComponent(name)}" class="archive-row" style="--i:${Math.min(i, 20)}">
          <span class="ar-num ar-ico">${ico('camara')}</span>
          <span class="ar-body">
            <span class="ar-date">${name}</span>
            <span class="ar-place ar-clip">${topFilms}${extra}</span>
          </span>
          <span class="ar-count">${stats.films.length} peli${stats.films.length !== 1 ? 's' : ''}</span>
        </a>`;
      }
      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;

      document.getElementById('director-search').addEventListener('input', function() {
        const q = normalize(this.value);
        for (const card of document.querySelectorAll('#directors-list .archive-row')) {
          card.style.display = normalize(card.textContent).includes(q) ? '' : 'none';
        }
      });
    }

    /* ── DIRECTOR DETAIL ── */
    function renderDirector(nombre) {
      const directors = getDirectorStats();
      const stats = directors[nombre];
      if (!stats) { notFound(`a ${nombre}`, '#directores', 'Ver todos los directores'); return; }

      const films = stats.films.sort((a, b) => {
        const ya = parseInt(a.peli.year) || 9999;
        const yb = parseInt(b.peli.year) || 9999;
        return ya - yb;
      });

      // Find which personas brought these films and in which findes
      const appearances = [];
      for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
        if (typeof m === 'string') continue;
        const peli = PELI_CACHE[m.slug];
        if (peli && peli.director && peli.director.split(', ').includes(nombre)) {
          appearances.push({ finde: f, persona: p.nombre, slug: m.slug, peli });
        }
      }

      let html = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#directores', label:'Directores'}, {href:'#', label: nombre}])}

        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem">
          <div class="persona-avatar avatar-dir" style="width:56px;height:56px;font-size:1.35rem">${ico('camara')}</div>
          <div>
            <h1 class="page-heading" style="margin-bottom:.1rem">${nombre}</h1>
            <div class="page-sub" style="margin-bottom:0">${films.length} película${films.length !== 1 ? 's' : ''} en el archivo</div>
          </div>
        </div>

        <h2 style="font-family:var(--ff-display);font-size:1.2rem;margin-bottom:.75rem">Filmografía</h2>
        <div class="columns is-multiline stagger">
      `;
      for (const [i, { slug, peli }] of films.entries()) {
        const orig = peli.titulo_original || peli.titulo;
        const es = peli.titulo_es || peli.titulo;
        const titleDisplay = orig.toLowerCase() === es.toLowerCase()
          ? orig : `${orig} <span class="peli-es">(${es})</span>`;
        const posterHtml = peli.poster
          ? `<img src="${posterUrl(peli.poster, POSTER.sm)}" alt="" loading="lazy" style="width:60px;height:90px;object-fit:cover;border-radius:4px">`
          : posterPh(orig, 'poster-ph-md');
        const rating = peli.tmdb_rating ? `<span style="color:var(--gold);font-size:.78rem">${ico('estrella','class="ico ico-estrella"')} ${fmtRating(peli.tmdb_rating)}</span>` : '';
        const genres = genreTags(peli) ? `<div class="mt-2">${genreTags(peli)}</div>` : '';

        html += `<div class="column is-half-tablet" style="--i:${i}">
          <a href="#pelicula/${slug}" style="text-decoration:none;color:inherit">
            <div class="card">
              <div class="card-content" style="display:flex;gap:.85rem;padding:1rem">
                ${posterHtml}
                <div style="flex:1;min-width:0">
                  <div style="font-weight:600;font-size:.92rem;margin-bottom:.2rem">${titleDisplay}</div>
                  <div style="font-size:.8rem;color:var(--tx-3)">${peli.year || '?'} · ${peli.runtime || ''}</div>
                  ${rating}
                  ${genres}
                </div>
              </div>
            </div>
          </a>
        </div>`;
      }
      html += `</div>`;

      // Appearances in Findes
      html += `<h2 style="font-family:var(--ff-display);font-size:1.2rem;margin-top:2rem;margin-bottom:.75rem">En los Findes</h2>`;
      html += `<div class="menu"><ul class="menu-list">`;
      const seen = new Set();
      for (const a of appearances) {
        const key = `${a.finde.numero}-${a.slug}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const orig = a.peli.titulo_original || a.peli.titulo;
        html += `<li><a href="#finde/${a.finde.numero}" style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
          <span><strong>${orig}</strong> — traída por <span style="color:var(--wine)">${a.persona}</span></span>
          <span style="color:var(--tx-3);font-size:.78rem;font-family:var(--ff-display);font-style:italic;flex-shrink:0">Finde #${a.finde.numero}</span>
        </a></li>`;
      }
      html += `</ul></div>`;

      html += `</div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── DÉCADAS (de películas) ── */
    function getMovieDecades() {
      const decades = {};
      for (const [slug, peli] of Object.entries(PELI_CACHE)) {
        if (!peli || !peli.year) continue;
        const yr = parseInt(peli.year);
        if (isNaN(yr)) continue;
        const dec = Math.floor(yr / 10) * 10;
        if (!decades[dec]) decades[dec] = [];
        decades[dec].push({ slug, peli });
      }
      return decades;
    }

    function renderDecadas() {
      const decades = getMovieDecades();
      const sorted = Object.keys(decades).map(Number).sort();

      let html = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Décadas</h1>
        <div class="page-sub">Películas del archivo agrupadas por la década en que fueron realizadas</div>

        <div class="columns is-multiline stagger">
      `;
      for (const [i, dec] of sorted.entries()) {
        const films = decades[dec];
        const topFilms = films
          .sort((a, b) => (b.peli.tmdb_rating || 0) - (a.peli.tmdb_rating || 0))
          .slice(0, 4);
        const posters = topFilms.filter(f => f.peli.poster).slice(0, 4);

        html += `<div class="column is-half-tablet is-one-third-desktop" style="--i:${i}">
          <a href="#decada/${dec}" style="text-decoration:none;color:inherit">
            <div class="card">
              <div class="card-content" style="padding:1.15rem">
                <div style="display:flex;gap:4px;margin-bottom:.75rem;height:80px;overflow:hidden;border-radius:4px">
                  ${posters.length ? posters.map(f =>
                    `<img src="${posterUrl(f.peli.poster, POSTER.xs)}" alt="" loading="lazy" style="height:80px;width:54px;object-fit:cover;border-radius:3px;flex-shrink:0">`
                  ).join('') : `<div style="height:80px;width:100%;background:var(--bg-inset);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--tx-3)">${ico('film')}</div>`}
                </div>
                <div style="font-family:var(--ff-display);font-size:1.6rem;color:var(--wine);line-height:1">${dec}s</div>
                <div style="font-size:.8rem;color:var(--tx-3);margin-top:.25rem">${films.length} película${films.length !== 1 ? 's' : ''}</div>
              </div>
            </div>
          </a>
        </div>`;
      }
      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    function renderDecada(dec) {
      const decades = getMovieDecades();
      const films = decades[dec];
      if (!films) { notFound(`la década de los ${dec}`, '#decadas', 'Ver todas las décadas'); return; }

      // Sort by year then title
      films.sort((a, b) => {
        const ya = parseInt(a.peli.year) || 0, yb = parseInt(b.peli.year) || 0;
        if (ya !== yb) return ya - yb;
        const ta = a.peli.titulo_original || a.peli.titulo;
        const tb = b.peli.titulo_original || b.peli.titulo;
        return ta.localeCompare(tb, 'es');
      });

      // Find who brought each film and in which finde
      function findAppearances(slug) {
        const apps = [];
        for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
          if (typeof m !== 'string' && m.slug === slug) apps.push({ persona: p.nombre, finde: f });
        }
        return apps;
      }

      // Group by year within the decade
      const years = {};
      for (const f of films) {
        const y = f.peli.year;
        if (!years[y]) years[y] = [];
        years[y].push(f);
      }

      let html = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#decadas', label:'Décadas'}, {href:'#', label: dec + 's'}])}

        <h1 class="page-heading">${dec}s</h1>
        <div class="page-sub">${films.length} película${films.length !== 1 ? 's' : ''} realizadas entre ${dec} y ${dec + 9}</div>

        <div id="decada-list">
      `;

      for (const year of Object.keys(years).sort()) {
        const yearFilms = years[year];
        html += `<div class="alpha-heading">${year} <span class="decade-count">${yearFilms.length}</span></div>`;

        for (const { slug, peli } of yearFilms) {
          const orig = peli.titulo_original || peli.titulo;
          const es = peli.titulo_es || peli.titulo;
          const titleDisplay = orig.toLowerCase() === es.toLowerCase()
            ? orig : `${orig} <span class="peli-es">(${es})</span>`;
          const posterHtml = peli.poster
            ? `<img class="film-poster-sm" src="${posterUrl(peli.poster, POSTER.xs)}" alt="" loading="lazy">`
            : posterPh(plainTitle(peli, slug), 'film-poster-ph');
          const apps = findAppearances(slug);
          const subParts = [];
          if (peli.director) subParts.push(peli.director);
          if (apps.length) subParts.push(apps.map(a =>
            `<a href="#persona/${encodeURIComponent(a.persona)}" style="color:var(--tx-3)">${a.persona}</a> · <a href="#finde/${a.finde.numero}" style="color:var(--tx-3)">#${a.finde.numero}</a>`
          ).join(' / '));

          html += `<div class="film-row">
            ${posterHtml}
            <div class="film-row-body">
              <div class="film-row-title"><a href="#pelicula/${slug}">${titleDisplay}</a></div>
              <div class="film-row-sub">${subParts.join(' — ')}</div>
            </div>
          </div>`;
        }
      }

      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── GÉNERO ── */
    function renderGenero(nombre) {
      const films = allFilmEntries().filter(f => genresOf(f.peli).includes(nombre));
      if (!films.length) { notFound(`el género "${nombre}"`, '#peliculas', 'Ver todas las películas'); return; }

      films.sort((a, b) => (parseFloat(b.peli.tmdb_rating) || 0) - (parseFloat(a.peli.tmdb_rating) || 0));

      // Géneros que más se repiten junto a este.
      const vecinos = {};
      for (const f of films) for (const g of genresOf(f.peli)) {
        if (g !== nombre) vecinos[g] = (vecinos[g] || 0) + 1;
      }
      const relacionados = Object.entries(vecinos).sort((a, b) => b[1] - a[1]).slice(0, 8);

      const conNota = films.filter(f => f.peli.tmdb_rating);
      const media = conNota.length
        ? conNota.reduce((s, f) => s + parseFloat(f.peli.tmdb_rating), 0) / conNota.length : null;

      document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#peliculas', label:'Películas'}, {href:'#', label: nombre}])}
        <h1 class="page-heading">${nombre}</h1>
        <div class="page-sub">
          ${films.length} película${films.length !== 1 ? 's' : ''} en el archivo${media ? ` · nota media ${media.toFixed(1)}` : ''}
        </div>
        ${relacionados.length ? `<div class="chips mb-5">
          ${relacionados.map(([g, n]) =>
            `<a class="chip" href="#genero/${encodeURIComponent(g)}">${g}<span class="chip-n">${n}</span></a>`).join('')}
        </div>` : ''}
        <div class="poster-grid stagger">
          ${films.map((f, i) => posterTile(f.slug, f.peli,
            [f.peli.year, appearancesOf(f.slug).map(a => a.persona).join(' / ')].filter(Boolean).join(' · '),
            Math.min(i, 24))).join('')}
        </div>
      </div></section>`;
    }

    /* ── ESTADÍSTICAS ── */
    function renderEstadisticas() {
      const films = allFilmEntries();
      const conFicha = films.filter(f => f.peli);
      const conNota = conFicha.filter(f => f.peli.tmdb_rating);
      const conAnio = conFicha.filter(f => parseInt(f.peli.year));
      const minutos = conFicha.reduce((s, f) => s + (parseInt(f.peli.runtime) || 0), 0);
      const notaMedia = conNota.length
        ? conNota.reduce((s, f) => s + parseFloat(f.peli.tmdb_rating), 0) / conNota.length : 0;
      const anioMedio = conAnio.length
        ? conAnio.reduce((s, f) => s + parseInt(f.peli.year), 0) / conAnio.length : 0;

      const horas = Math.round(minutos / 60);
      const dias = (minutos / 60 / 24).toFixed(1);

      // ── Rankings
      const cuenta = (lista) => Object.entries(lista.reduce((acc, k) => (acc[k] = (acc[k] || 0) + 1, acc), {}))
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es'));

      const generos = cuenta(conFicha.flatMap(f => genresOf(f.peli)));
      const directores = cuenta(conFicha.flatMap(f => f.peli.director ? f.peli.director.split(', ') : []));
      const decadas = cuenta(conAnio.map(f => `${Math.floor(parseInt(f.peli.year) / 10) * 10}s`))
        .sort((a, b) => a[0].localeCompare(b[0]));

      // ── Récords
      const maxBy = (arr, fn) => arr.reduce((best, f) => (!best || fn(f) > fn(best)) ? f : best, null);
      const minBy = (arr, fn) => arr.reduce((best, f) => (!best || fn(f) < fn(best)) ? f : best, null);
      const records = [
        ['Mejor valorada',  maxBy(conNota, f => parseFloat(f.peli.tmdb_rating)), f => `${ico('estrella','class="ico ico-estrella"')} ${fmtRating(f.peli.tmdb_rating)}`],
        ['Peor valorada',   minBy(conNota, f => parseFloat(f.peli.tmdb_rating)), f => `${ico('estrella','class="ico ico-estrella"')} ${fmtRating(f.peli.tmdb_rating)}`],
        ['La más antigua',  minBy(conAnio, f => parseInt(f.peli.year)),          f => f.peli.year],
        ['La más reciente', maxBy(conAnio, f => parseInt(f.peli.year)),          f => f.peli.year],
        ['La más larga',    maxBy(conFicha.filter(f => parseInt(f.peli.runtime)), f => parseInt(f.peli.runtime)), f => f.peli.runtime],
        ['La más corta',    minBy(conFicha.filter(f => parseInt(f.peli.runtime)), f => parseInt(f.peli.runtime)), f => f.peli.runtime],
      ].filter(r => r[1]);

      // ── Perfil por persona
      const personas = [...new Set(DATA.flatMap(f => f.personas.map(p => p.nombre)))];
      const perfiles = personas.map(nombre => {
        const slugs = [];
        for (const f of DATA) for (const p of f.personas) {
          if (p.nombre !== nombre) continue;
          for (const m of p.peliculas) if (typeof m !== 'string' && m.slug) slugs.push(m.slug);
        }
        const fichas = slugs.map(s => PELI_CACHE[s]).filter(Boolean);
        const notas = fichas.map(p => parseFloat(p.tmdb_rating)).filter(n => !isNaN(n));
        const anios = fichas.map(p => parseInt(p.year)).filter(n => !isNaN(n));
        const gs = cuenta(fichas.flatMap(p => genresOf(p)));
        return {
          nombre,
          total: slugs.length,
          findes: DATA.filter(f => f.personas.some(p => p.nombre === nombre)).length,
          nota: notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : null,
          anio: anios.length ? Math.round(anios.reduce((a, b) => a + b, 0) / anios.length) : null,
          genero: gs.length ? gs[0][0] : null
        };
      }).sort((a, b) => b.total - a.total);

      const bars = (items, max, clase, hrefFn) => `<div class="bars">
        ${items.map(([label, n], i) => `<div class="bar-row">
          ${hrefFn ? `<a class="bar-label" href="${hrefFn(label)}">${label}</a>` : `<span class="bar-label">${label}</span>`}
          <span class="bar-track"><span class="bar-fill ${clase || ''}" style="width:${(n / max * 100).toFixed(1)}%;--i:${i}"></span></span>
          <span class="bar-value">${n}</span>
        </div>`).join('')}
      </div>`;

      const topGeneros = generos.slice(0, 10);
      const topDirectores = directores.filter(([, n]) => n > 1).slice(0, 12);

      document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Las cifras</h1>
        <div class="page-sub">Lo que ${DATA.length} findes de cine dejan en números.</div>

        <div class="stat-cards">
          <div class="stat-card"><div class="k">${films.length}</div><div class="l">Películas</div></div>
          <div class="stat-card"><div class="k">${horas}</div><div class="l">Horas de cine</div></div>
          <div class="stat-card"><div class="k">${dias}</div><div class="l">Días seguidos</div></div>
          <div class="stat-card"><div class="k">${notaMedia.toFixed(1)}</div><div class="l">Nota media</div></div>
          <div class="stat-card"><div class="k">${Math.round(anioMedio)}</div><div class="l">Año medio</div></div>
          <div class="stat-card"><div class="k">${directores.length}</div><div class="l">Directores</div></div>
        </div>

        <h2 class="section-title">Récords del archivo</h2>
        <div class="section-note">Según las notas de TMDB, con todo el respeto.</div>
        <div class="record-list">
          ${records.map(([kind, f, valFn]) => {
            const url = posterUrl(f.peli.poster, POSTER.xs);
            return `<a class="record" href="#pelicula/${f.slug}">
              ${url ? `<img src="${url}" alt="" loading="lazy">` : posterPh(plainTitle(f.peli, f.titulo), 'ph')}
              <div class="record-body">
                <div class="record-kind">${kind}</div>
                <div class="record-title">${plainTitle(f.peli, f.titulo)}</div>
                <div class="record-meta">${[f.peli.year, f.peli.director].filter(Boolean).join(' · ')}</div>
              </div>
              <span class="record-num">${valFn(f)}</span>
            </a>`;
          }).join('')}
        </div>

        <h2 class="section-title">Por década de rodaje</h2>
        <div class="section-note">En qué época se hicieron las películas que veis.</div>
        ${bars(decadas, Math.max(...decadas.map(d => d[1])), '', l => `#decada/${parseInt(l)}`)}

        <h2 class="section-title">Géneros favoritos</h2>
        <div class="section-note">Una película cuenta en todos sus géneros.</div>
        ${bars(topGeneros, topGeneros[0] ? topGeneros[0][1] : 1, 'alt', l => `#genero/${encodeURIComponent(l)}`)}

        ${topDirectores.length ? `<h2 class="section-title">Directores recurrentes</h2>
        <div class="section-note">Los que han aparecido más de una vez.</div>
        ${bars(topDirectores, topDirectores[0][1], 'alt2', l => `#director/${encodeURIComponent(l)}`)}` : ''}

        <h2 class="section-title">Quién trae qué</h2>
        <div class="section-note">El perfil de cada uno, según lo que ha puesto sobre la mesa.</div>
        <div class="profile-grid">
          ${perfiles.map(p => `<div class="profile-item">
            <div class="pl">${p.findes} findes · ${p.total} pelis</div>
            <div class="pv"><a href="#persona/${encodeURIComponent(p.nombre)}">${p.nombre}</a></div>
            <div class="ps">
              ${p.nota ? `nota ${p.nota.toFixed(1)}` : 'sin notas'}
              ${p.anio ? ` · año medio ${p.anio}` : ''}
            </div>
            ${p.genero ? `<div class="ps">le va el ${p.genero.toLowerCase()}</div>` : ''}
          </div>`).join('')}
        </div>
      </div></section>`;
    }

    /* ── QUIZ ── */
    let QUIZ_DATA = null;

    /* ═══ Quiz Precríticos ═══
       Las preguntas no están escritas a mano: se generan del propio archivo,
       así que nunca se repiten dos rondas iguales y siempre están al día. */

    const azar = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const barajar = (arr) => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
    // n elementos distintos, sin repetir.
    const muestra = (arr, n) => barajar(arr).slice(0, n);

    // En el quiz manda el título en castellano: es por el que las conocéis,
    // y evita preguntas imposibles del tipo «Krótki film o zabijaniu».
    function tituloCorto(peli, fallback) {
      const t = (peli && (peli.titulo_es || peli.titulo)) || fallback || '';
      return t.length > 60 ? t.slice(0, 57) + '…' : t;
    }

    // Fuera de las opciones los nombres en otros alfabetos (松本人志…): como
    // distractores no engañan a nadie y como respuesta se delatan solos.
    const latino = (s) => !!s && !/[Ͱ-᷿⺀-￿]/.test(s);
    const minutos = (peli) => parseInt(peli && peli.runtime) || 0;
    const anioDe = (e) => parseInt(e.peli.year);
    const normTitulo = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const escHtml = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const etq = (e) => tituloCorto(e.peli, e.titulo);
    const etiquetaFinde = (f) => `Finde #${f.numero} · ${f.fecha || '—'}`;
    // Prefiere los candidatos que cumplen `cerca` (mismo finde, misma época…)
    // y completa con el resto: los distractores verosímiles hacen pensar.
    function distractores(pool, n, cerca) {
      const buenos = muestra(pool.filter(cerca), n);
      if (buenos.length >= n) return buenos;
      const usados = new Set(buenos);
      return [...buenos, ...muestra(pool.filter(x => !usados.has(x)), n - buenos.length)];
    }

    // Géneros de TMDB con los que se puede preguntar sin ambigüedad, y los
    // vecinos que no pueden hacer de distractor (un «suspense» puede ser terror).
    const GEN_UNA = {
      'Terror': 'una película de terror', 'Ciencia ficción': 'una película de ciencia ficción',
      'Animación': 'una película de animación', 'Documental': 'un documental', 'Western': 'un western',
      'Bélica': 'una película bélica', 'Música': 'una película musical', 'Fantasía': 'una película fantástica',
      'Acción': 'una película de acción'
    };
    const GEN_VARIAS = {
      'Terror': 'películas de terror', 'Comedia': 'comedias', 'Crimen': 'películas de crimen',
      'Suspense': 'películas de suspense', 'Misterio': 'películas de misterio', 'Romance': 'películas románticas',
      'Ciencia ficción': 'películas de ciencia ficción', 'Fantasía': 'películas fantásticas',
      'Acción': 'películas de acción', 'Animación': 'películas de animación', 'Documental': 'documentales'
    };
    const GEN_VECINOS = {
      'Terror': ['Suspense', 'Misterio', 'Fantasía'], 'Ciencia ficción': ['Fantasía'],
      'Fantasía': ['Ciencia ficción', 'Terror', 'Animación', 'Familia'], 'Animación': ['Fantasía', 'Familia'],
      'Documental': ['Música', 'Historia'], 'Western': ['Aventura', 'Acción'], 'Bélica': ['Historia', 'Acción'],
      'Música': ['Documental'], 'Acción': ['Aventura', 'Crimen', 'Suspense', 'Bélica', 'Western']
    };
    // Solo estos sirven para «¿cuál de estas es…?»: comedia y romance se
    // mezclan con el drama sin que TMDB lo diga.
    const GEN_NITIDOS = Object.keys(GEN_VECINOS);
    const sinGenero = (peli, g) => !genresOf(peli).some(x => x === g || (GEN_VECINOS[g] || []).includes(x));

    // Datos de Wikidata (enrich_wikidata.py): países, reparto, música,
    // fotografía, guion, temas y dónde transcurre.
    const PAIS_NORMAL = {
      'Alemania Occidental': 'Alemania', 'República Democrática Alemana': 'Alemania',
      'República Federal de Yugoslavia': 'Yugoslavia'
    };
    const paisesDe = (peli) => [...new Set(((peli && peli.paises) || []).map(p => PAIS_NORMAL[p] || p))];
    const rolDe = (peli, campo) => ((peli && peli[campo]) || []).filter(latino);
    const dirDe = (peli) => (peli && peli.director ? peli.director.split(', ') : []);
    const yLista = (xs) => xs.length > 1 ? `${xs.slice(0, -1).join(', ')} y ${xs[xs.length - 1]}` : (xs[0] || '');
    const conAnio = (e) => `<em>${etq(e)}</em>${e.peli && e.peli.year ? ` (${e.peli.year})` : ''}`;
    const laTrajo = (e) => `${e.apariciones[0].persona} al Finde #${e.apariciones[0].finde.numero}`;
    const cerca = (x, anio, r = 10) => Math.abs(anioDe(x) - anio) <= r;
    const mayuscula = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const pl = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
    const GENTILICIO = {
      'Francia': 'francesas', 'Reino Unido': 'británicas', 'España': 'españolas', 'Japón': 'japonesas',
      'Italia': 'italianas', 'Alemania': 'alemanas', 'Canadá': 'canadienses', 'México': 'mexicanas'
    };
    // Ciudades que no se solapan entre sí: «Estados Unidos» o «California»
    // no pueden ser opción junto a «Los Ángeles».
    const CIUDADES = ['Nueva York', 'Los Ángeles', 'París', 'Londres', 'Tokio', 'San Francisco', 'Nueva Orleans',
      'Madrid', 'Viena', 'Toronto', 'Milán', 'Roma', 'Hong Kong', 'Berlín'];
    // Temas de Wikidata por los que se puede preguntar: concretos y en
    // castellano. El resto («identidad», «longing»…) valdría para cualquiera.
    const TEMAS = new Set(['Segunda Guerra Mundial', 'Guerra Fría', 'Conflicto norirlandés', 'aborto', 'adolescencia',
      'alcoholismo', 'asesino en serie', 'aviación', 'casa embrujada', 'crimen organizado', 'epidemia', 'incesto',
      'industria cinematográfica', 'inteligencia artificial', 'juego de apuestas', 'manipulación mental', 'pena de muerte',
      'pornografía', 'prostitución', 'secuestro', 'sobrenatural', 'suicidio', 'tercera edad', 'venganza',
      'viaje a través del tiempo', 'vida extraterrestre', 'voyeurismo']);
    // Temas que se pisan: una casa embrujada es sobrenatural.
    const TEMAS_VECINOS = { 'casa embrujada': ['sobrenatural'], 'sobrenatural': ['casa embrujada'] };

    // Contexto precalculado: una vez por ronda, no por pregunta.
    function contextoQuiz() {
      const findes = DATA.filter(f => f.personas.length);
      const personas = [...new Set(DATA.flatMap(f => f.personas.map(p => p.nombre)))];
      const lugares = [...new Set(DATA.flatMap(f => f.lugares))];
      const pelis = [];
      for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
        if (typeof m === 'string' || !m.slug) continue;
        const ficha = PELI_CACHE[m.slug];
        pelis.push({ slug: m.slug, titulo: m.titulo, peli: ficha, persona: p.nombre, finde: f });
      }
      // Una entrada por película, guardando todas sus apariciones.
      const porSlug = new Map();
      for (const e of pelis) {
        if (!porSlug.has(e.slug)) porSlug.set(e.slug, { ...e, apariciones: [] });
        porSlug.get(e.slug).apariciones.push({ persona: e.persona, finde: e.finde });
      }
      const unicas = [...porSlug.values()];
      const conFicha = unicas.filter(e => e.peli);
      const conDirector = conFicha.filter(e => e.peli.director && latino(e.peli.director));
      const pelisDeDirector = {};
      for (const e of conDirector) for (const d of dirDe(e.peli)) (pelisDeDirector[d] || (pelisDeDirector[d] = [])).push(e);
      const findesDe = {};
      for (const f of findes) for (const p of f.personas) (findesDe[p.nombre] || (findesDe[p.nombre] = [])).push(f.numero);
      // Índices inversos: actor, músico, país… → sus películas del archivo.
      const indice = (valores) => {
        const idx = {};
        for (const e of conFicha) for (const v of valores(e.peli)) (idx[v] || (idx[v] = [])).push(e);
        return idx;
      };
      return {
        findes, personas, lugares, pelis, unicas, conFicha, conDirector, pelisDeDirector, findesDe,
        conPoster: conFicha.filter(e => e.peli.poster),
        conAnio: conFicha.filter(e => parseInt(e.peli.year)),
        conNota: conFicha.filter(e => parseFloat(e.peli.tmdb_rating)),
        conDuracion: conFicha.filter(e => minutos(e.peli) >= 40),
        conSinopsis: conFicha.filter(e => (e.peli.plot || '').length >= 80),
        // Solo cuando el título español no es una mera traducción literal
        // ni lo contiene: «5x2 (Cinco veces dos)» no tiene gracia.
        conOriginal: conFicha.filter(e => {
          const o = normTitulo(e.peli.titulo_original), s = normTitulo(e.peli.titulo_es);
          return latino(e.peli.titulo_original) && o && s && !o.includes(s) && !s.includes(o);
        }),
        directores: Object.keys(pelisDeDirector),
        unaSolaVez: unicas.filter(e => e.apariciones.length === 1),
        reparto: indice(p => rolDe(p, 'reparto')),
        musica: indice(p => rolDe(p, 'musica')),
        fotografia: indice(p => rolDe(p, 'fotografia')),
        guion: indice(p => rolDe(p, 'guion')),
        temas: indice(p => rolDe(p, 'temas').filter(t => TEMAS.has(t))),
        ciudades: indice(p => rolDe(p, 'escenario').filter(l => CIUDADES.includes(l))),
        porPais: indice(paisesDe),
        // Sin reparto en la ficha no se sabe quién sale: no vale de distractor
        // en preguntas de reparto.
        conReparto: conFicha.filter(e => rolDe(e.peli, 'reparto').length >= 3)
      };
    }

    // ── Vínculos: cada generador devuelve una pregunta o null si no hay datos
    // suficientes o si pudiera tener más de una respuesta buena. `sobre` es la
    // persona o el país del que trata: uno por ronda, que Nicolas Cage no copa.
    // `pelis` son las películas que nombra: ninguna sale en más de dos.

    const ROLES = {
      reparto: { tipo: 'Mismo actor', hace: 'sale en',
        pregunta: (a, b) => `¿Qué actor o actriz sale en ${a} y en ${b}?` },
      musica: { tipo: 'La música', hace: 'puso música a',
        pregunta: (a, b) => `¿Quién compuso la música de ${a} y de ${b}?` },
      fotografia: { tipo: 'La fotografía', hace: 'fotografió',
        pregunta: (a, b) => `¿Quién fue el director de fotografía de ${a} y de ${b}?` },
      guion: { tipo: 'El guion', hace: 'escribió',
        pregunta: (a, b) => `¿Quién firmó el guion de ${a} y de ${b}?` }
    };

    // Quién une dos películas: un actor, un músico, un operador, un guionista.
    function personaComun(campo) {
      const rol = ROLES[campo];
      return (c) => {
        // Actores, casi siempre de los que salen en tres o más: con dos, muchos
        // son secundarios que no conoce nadie.
        const min = campo === 'reparto' && Math.random() < 0.7 ? 3 : 2;
        const v = azar(Object.keys(c[campo]).filter(x => c[campo][x].length >= min));
        if (!v) return null;
        const suyas = c[campo][v];
        const pares = [];
        for (let i = 0; i < suyas.length; i++) for (let j = i + 1; j < suyas.length; j++) pares.push([suyas[i], suyas[j]]);
        // Mejor de directores distintos: Léaud en dos Truffaut se adivina sin saber.
        const distintos = pares.filter(([a, b]) => !dirDe(a.peli).some(d => dirDe(b.peli).includes(d)));
        const [a, b] = azar(distintos.length ? distintos : pares);
        if (dirDe(a.peli).includes(v) && dirDe(b.peli).includes(v)) return null;
        const de = (e) => rolDe(e.peli, campo);
        const enAmbas = new Set(de(a).filter(x => de(b).includes(x)));
        // Tienta más alguien de una de las dos; el resto, del mismo oficio y época.
        const deUna = muestra([...new Set([...de(a), ...de(b)])].filter(x => !enAmbas.has(x)), 2);
        const anio = anioDe(a);
        // Actores, solo los que salen en más de una: son más reconocibles y
        // así no se recorren los cinco mil del reparto.
        const oficio = Object.keys(c[campo]).filter(x => campo !== 'reparto' || c[campo][x].length >= 2);
        const resto = distractores(oficio.filter(x => !enAmbas.has(x) && !deUna.includes(x)
          && !de(a).includes(x) && !de(b).includes(x)), 3 - deUna.length,
          x => c[campo][x].some(y => cerca(y, anio, 12)));
        if (deUna.length + resto.length < 3) return null;
        return {
          clave: `${campo}-${v}`, sobre: v, pelis: [a.slug, b.slug],
          peso: suyas.length + (distintos.length ? 1 : 0) + Math.min(3, Math.abs(anioDe(a) - anioDe(b)) / 10),
          tipo: rol.tipo,
          pregunta: rol.pregunta(`<em>${etq(a)}</em>`, `<em>${etq(b)}</em>`),
          poster: null,
          opciones: [v, ...deUna, ...resto],
          correcta: v,
          explicacion: `<strong>${v}</strong> ${rol.hace} ${yLista(suyas.map(conAnio))}.`
            + ` <em>${etq(a)}</em> la trajo ${laTrajo(a)}; <em>${etq(b)}</em>, ${laTrajo(b)}.`,
          href: `#pelicula/${b.slug}`
        };
      };
    }

    const VINCULOS = {
      // ── Dónde más sale este actor
      enCualTambien(c) {
        const v = azar(Object.keys(c.reparto).filter(x => c.reparto[x].length >= (Math.random() < 0.7 ? 3 : 2)));
        if (!v) return null;
        const [a, b] = muestra(c.reparto[v], 2);
        const otras = distractores(c.conReparto.filter(x => !rolDe(x.peli, 'reparto').includes(v)), 3,
          x => cerca(x, anioDe(b), 8));
        if (otras.length < 3) return null;
        return {
          clave: `encual-${v}`, sobre: v, pelis: [a.slug, b.slug], peso: c.reparto[v].length,
          tipo: 'Mismo actor',
          pregunta: `¿En cuál de estas sale también <strong>${v}</strong>, como en <em>${etq(a)}</em>?`,
          poster: a.peli.poster,
          opciones: [etq(b), ...otras.map(etq)],
          correcta: etq(b),
          explicacion: `${v} sale en ${yLista(c.reparto[v].map(conAnio))}. <em>${etq(b)}</em> la trajo ${laTrajo(b)}.`,
          href: `#pelicula/${b.slug}`
        };
      },

      // ── Comparten reparto, sin decir quién
      comparteReparto(c) {
        const a = azar(c.conReparto);
        if (!a) return null;
        const suyo = new Set(rolDe(a.peli, 'reparto'));
        const comparte = (x) => x.slug !== a.slug && rolDe(x.peli, 'reparto').some(n => suyo.has(n));
        const b = azar(c.conReparto.filter(x => comparte(x) && !dirDe(x.peli).some(d => dirDe(a.peli).includes(d))));
        if (!b) return null;
        // Las otras, sin nadie del reparto de la primera: si no, habría dos buenas.
        const otras = distractores(c.conReparto.filter(x => x.slug !== a.slug && !comparte(x)), 3,
          x => cerca(x, anioDe(b), 8));
        if (otras.length < 3) return null;
        const comunes = rolDe(b.peli, 'reparto').filter(n => suyo.has(n));
        return {
          clave: `comparte-${[a.slug, b.slug].sort().join('|')}`, pelis: [a.slug, b.slug], peso: 3,
          tipo: 'Mismo reparto',
          pregunta: `¿Cuál de estas comparte algún actor con <em>${etq(a)}</em>?`,
          poster: a.peli.poster,
          opciones: [etq(b), ...otras.map(etq)],
          correcta: etq(b),
          explicacion: `${conAnio(b)} y ${conAnio(a)} comparten a <strong>${yLista(comunes)}</strong>. En las otras tres no sale nadie del reparto de <em>${etq(a)}</em>.`,
          href: `#pelicula/${b.slug}`
        };
      },

      // ── Directores que también actúan
      directorActua(c) {
        const casos = [];
        for (const d of c.directores) for (const e of (c.reparto[d] || [])) if (!dirDe(e.peli).includes(d)) casos.push({ d, e });
        const k = azar(casos);
        if (!k) return null;
        const suya = azar(c.pelisDeDirector[k.d]);
        const otras = distractores(c.conReparto.filter(x => !rolDe(x.peli, 'reparto').includes(k.d) && !dirDe(x.peli).includes(k.d)), 3,
          x => cerca(x, anioDe(k.e), 8));
        if (otras.length < 3) return null;
        return {
          clave: `actua-${k.d}`, sobre: k.d, pelis: [suya.slug, k.e.slug], peso: 4,
          tipo: 'Director y actor',
          pregunta: `<strong>${k.d}</strong> dirigió <em>${etq(suya)}</em>. ¿En cuál de estas, de otro director, sale como actor?`,
          poster: null,
          opciones: [etq(k.e), ...otras.map(etq)],
          correcta: etq(k.e),
          explicacion: `${k.d} sale en ${conAnio(k.e)}, de ${k.e.peli.director}. La trajo ${laTrajo(k.e)}.`,
          href: `#pelicula/${k.e.slug}`
        };
      },

      // ── Del mismo director
      mismoDirector(c) {
        const d = azar(c.directores.filter(x => c.pelisDeDirector[x].length >= 2));
        if (!d) return null;
        const [a, b] = muestra(c.pelisDeDirector[d], 2);
        const otras = distractores(c.conDirector.filter(x => !dirDe(x.peli).includes(d)), 3,
          x => cerca(x, anioDe(b), 8));
        if (otras.length < 3) return null;
        return {
          clave: `mismodir-${d}`, sobre: d, pelis: [a.slug, b.slug], peso: c.pelisDeDirector[d].length,
          tipo: 'Mismo director',
          pregunta: `¿Cuál de estas es del mismo director que <em>${etq(a)}</em>?`,
          poster: a.peli.poster,
          opciones: [etq(b), ...otras.map(etq)],
          correcta: etq(b),
          explicacion: `Las dos son de <strong>${d}</strong>, que en los findes suma ${yLista(c.pelisDeDirector[d].map(conAnio))}.`,
          href: `#director/${encodeURIComponent(d)}`
        };
      },

      // ── Del mismo país (EE. UU. no: sería casi cualquiera)
      mismoPais(c) {
        const p = azar(Object.keys(c.porPais).filter(x => x !== 'Estados Unidos' && c.porPais[x].length >= 2 && c.porPais[x].length <= 40));
        if (!p) return null;
        const [a, b] = muestra(c.porPais[p], 2);
        // Las otras, sin ningún país en común con la primera: con las
        // coproducciones, «también» podría valer por otro país.
        const suyos = paisesDe(a.peli);
        const otras = distractores(c.conFicha.filter(x => paisesDe(x.peli).length && !paisesDe(x.peli).some(q => suyos.includes(q))), 3,
          x => cerca(x, anioDe(b), 8));
        if (otras.length < 3) return null;
        const pb = paisesDe(b.peli);
        return {
          clave: `pais-${p}`, sobre: p, pelis: [a.slug, b.slug], peso: 2 + 20 / c.porPais[p].length,
          tipo: 'Mismo país',
          pregunta: `<em>${etq(a)}</em> es una producción de <strong>${p}</strong>. ¿Cuál de estas también?`,
          poster: a.peli.poster,
          opciones: [etq(b), ...otras.map(etq)],
          correcta: etq(b),
          explicacion: `${conAnio(b)} es ${pb.length > 1 ? `una coproducción de ${yLista(pb)}` : `de ${p}`}. En los findes se han visto ${c.porPais[p].length} películas con participación de ${p}.`,
          href: `#pelicula/${b.slug}`
        };
      },

      // ── Qué tema comparten tres películas
      temaComun(c) {
        const t = azar(Object.keys(c.temas).filter(x => c.temas[x].length >= 3));
        if (!t) return null;
        const tres = muestra(c.temas[t], 3);
        const suyos = new Set(tres.flatMap(e => rolDe(e.peli, 'temas')));
        const otros = muestra(Object.keys(c.temas).filter(x => c.temas[x].length >= 2 && !suyos.has(x)
          && !(TEMAS_VECINOS[t] || []).includes(x)), 3);
        if (otros.length < 3) return null;
        return {
          clave: `tema-${t}`, sobre: t, pelis: tres.map(e => e.slug), peso: 3,
          tipo: 'Tema común',
          pregunta: `¿Qué tema tienen en común ${yLista(tres.map(e => `<em>${etq(e)}</em>`))}?`,
          poster: null,
          opciones: [t, ...otros].map(mayuscula),
          correcta: mayuscula(t),
          explicacion: c.temas[t].length > 3
            ? `Las tres tratan de ${t}, igual que ${yLista(c.temas[t].filter(e => !tres.includes(e)).map(conAnio))}.`
            : `Las tres tratan de ${t}, y ninguna otra del archivo.`,
          href: `#pelicula/${tres[0].slug}`
        };
      },

      // ── En qué ciudad transcurren tres películas
      dondeTranscurren(c) {
        const l = azar(Object.keys(c.ciudades).filter(x => c.ciudades[x].length >= 3));
        if (!l) return null;
        const tres = muestra(c.ciudades[l], 3);
        const suyas = new Set(tres.flatMap(e => rolDe(e.peli, 'escenario')));
        const otras = muestra(Object.keys(c.ciudades).filter(x => !suyas.has(x)), 3);
        if (otras.length < 3) return null;
        return {
          clave: `ciudad-${l}`, sobre: l, pelis: tres.map(e => e.slug), peso: 3,
          tipo: 'Dónde pasa',
          pregunta: `¿En qué ciudad transcurren ${yLista(tres.map(e => `<em>${etq(e)}</em>`))}?`,
          poster: null,
          opciones: [l, ...otras],
          correcta: l,
          explicacion: `En ${l} transcurren ${c.ciudades[l].length} películas del archivo, entre ellas ${yLista(tres.map(conAnio))}.`,
          href: `#pelicula/${tres[0].slug}`
        };
      },

      // ── Tres comparten algo; la cuarta, no
      laIntrusa(c) {
        const conCampo = (campo) => c.conFicha.filter(x => rolDe(x.peli, campo).length);
        const tipos = [
          { id: 'actor', idx: c.reparto, pool: c.conReparto, tiene: (x, v) => rolDe(x.peli, 'reparto').includes(v),
            txt: v => `tienen a <strong>${v}</strong> en el reparto` },
          { id: 'dir', idx: c.pelisDeDirector, pool: c.conDirector, tiene: (x, v) => dirDe(x.peli).includes(v),
            txt: v => `son de <strong>${v}</strong>` },
          { id: 'foto', idx: c.fotografia, pool: conCampo('fotografia'), tiene: (x, v) => rolDe(x.peli, 'fotografia').includes(v),
            txt: v => `tienen fotografía de <strong>${v}</strong>` },
          { id: 'musica', idx: c.musica, pool: conCampo('musica'), tiene: (x, v) => rolDe(x.peli, 'musica').includes(v),
            txt: v => `tienen música de <strong>${v}</strong>` },
          { id: 'pais', idx: c.porPais, pool: c.conFicha.filter(x => paisesDe(x.peli).length), tiene: (x, v) => paisesDe(x.peli).includes(v),
            txt: v => `son producciones de <strong>${v}</strong>`, max: 15 },
          { id: 'ciudad', idx: c.ciudades, pool: conCampo('escenario'), tiene: (x, v) => rolDe(x.peli, 'escenario').includes(v),
            txt: v => `transcurren en <strong>${v}</strong>` }
        ];
        const t = azar(tipos);
        const v = azar(Object.keys(t.idx).filter(x => t.idx[x].length >= 3 && t.idx[x].length <= (t.max || 99)));
        if (!v) return null;
        const tres = muestra(t.idx[v], 3);
        const anio = tres.map(anioDe).sort((x, y) => x - y)[1];
        const intrusa = distractores(t.pool.filter(x => !t.tiene(x, v)), 1, x => cerca(x, anio, 6))[0];
        if (!intrusa) return null;
        return {
          clave: `intrusa-${t.id}-${v}`, sobre: v, pelis: [...tres, intrusa].map(e => e.slug), peso: t.idx[v].length,
          tipo: 'La intrusa',
          pregunta: `Tres de estas ${t.txt(v)}. ¿Cuál es la intrusa?`,
          poster: null,
          opciones: [etq(intrusa), ...tres.map(etq)],
          correcta: etq(intrusa),
          explicacion: `${conAnio(intrusa)} no. Las otras tres sí: ${yLista(tres.map(conAnio))}.`,
          href: `#pelicula/${intrusa.slug}`
        };
      }
    };

    // ── Cifras del archivo

    // «¿Quién/cuál tiene más…?» a partir de un recuento. Null si hay empate
    // arriba: no se puede preguntar por un primero que no existe.
    function ranking({ clave, tipo = 'Cifras', pregunta, cuenta, fmt, href }) {
      const orden = Object.entries(cuenta).sort((a, b) => b[1] - a[1]);
      if (orden.length < 4 || fmt(orden[0][1]) === fmt(orden[1][1])) return null;
      // Los distractores, de los que van justo detrás en la tabla.
      const todos = [orden[0], ...muestra(orden.slice(1, 7), 3)].sort((a, b) => b[1] - a[1]);
      return {
        clave, tipo, pregunta, poster: null,
        opciones: todos.map(x => x[0]),
        correcta: orden[0][0],
        explicacion: todos.map(([k, v]) => `${k}: ${fmt(v)}`).join('<br>'),
        href: href(orden[0][0])
      };
    }

    // «¿Cuántas…?», con opciones a saltos proporcionales al valor.
    function cuantas({ clave, pregunta, valor, explicacion, href }) {
      const paso = Math.max(1, Math.round(valor * 0.2));
      const otros = muestra([-3, -2, -1, 1, 2, 3].map(k => valor + k * paso).filter(v => v > 0), 3);
      return {
        clave, tipo: 'Cifras', pregunta, poster: null,
        opciones: [valor, ...otros].map(String),
        correcta: String(valor),
        explicacion, href
      };
    }

    const media = (xs) => xs.reduce((s, x) => s + x, 0) / xs.length;
    // Recuento por persona sobre lo que trajo (las repetidas cuentan para cada uno).
    function porPersona(c, valor, minimo = 0) {
      const res = {};
      for (const p of c.personas) {
        const suyas = c.pelis.filter(e => e.persona === p && e.peli);
        if (suyas.length < minimo) continue;
        const v = valor(suyas);
        if (v !== null && !Number.isNaN(v)) res[p] = v;
      }
      return res;
    }
    const contar = (idx) => Object.fromEntries(Object.entries(idx).map(([k, v]) => [k, v.length]));
    // «Años 70», pero «Años 2020»: «Años 20» sería ambiguo.
    const decadaEtiqueta = (e) => {
      const d = Math.floor(anioDe(e) / 10) * 10;
      return `Años ${d < 2000 ? String(d).slice(2) : d}`;
    };
    const hrefPersona = (p) => `#persona/${encodeURIComponent(p)}`;

    const CIFRAS = {
      directorMas: (c) => ranking({
        clave: 'mas-director', pregunta: '¿De qué director se han visto más películas en los findes?',
        cuenta: contar(c.pelisDeDirector), fmt: n => pl(n, 'película', 'películas'), href: d => `#director/${encodeURIComponent(d)}` }),
      actorMas: (c) => ranking({
        clave: 'mas-actor', pregunta: '¿Qué actor o actriz sale en más películas de los findes?',
        cuenta: contar(c.reparto), fmt: n => pl(n, 'película', 'películas'), href: () => '#estadisticas' }),
      fotografiaMas: (c) => ranking({
        clave: 'mas-foto', pregunta: '¿Qué director de fotografía firma más películas de los findes?',
        cuenta: contar(c.fotografia), fmt: n => pl(n, 'película', 'películas'), href: () => '#estadisticas' }),
      musicaMas: (c) => ranking({
        clave: 'mas-musica', pregunta: '¿Qué compositor firma más bandas sonoras de los findes?',
        cuenta: contar(c.musica), fmt: n => pl(n, 'película', 'películas'), href: () => '#estadisticas' }),
      guionMas: (c) => ranking({
        clave: 'mas-guion', pregunta: '¿Qué guionista firma más películas de los findes?',
        cuenta: contar(c.guion), fmt: n => pl(n, 'película', 'películas'), href: () => '#estadisticas' }),
      paisSegundo(c) {
        const cuenta = contar(c.porPais);
        delete cuenta['Estados Unidos'];
        return ranking({
          clave: 'mas-pais', pregunta: 'Quitando Estados Unidos, ¿qué país ha puesto más películas en los findes?',
          cuenta, fmt: n => pl(n, 'película', 'películas'), href: () => '#estadisticas' });
      },
      cuantasDePais(c) {
        const p = azar(Object.keys(GENTILICIO).filter(x => c.porPais[x]));
        if (!p) return null;
        const n = c.porPais[p].length;
        const solas = c.porPais[p].filter(e => paisesDe(e.peli).length === 1).length;
        return cuantas({
          clave: 'cuantas-pais', valor: n,
          pregunta: `¿Cuántas películas ${GENTILICIO[p]} (contando coproducciones) se han visto en los findes?`,
          explicacion: `${n}, de las que ${solas} son solo de ${p} y ${n - solas} coproducciones.`, href: '#estadisticas' });
      },
      cuantosPaises(c) {
        const n = Object.keys(c.porPais).length;
        const raros = Object.keys(c.porPais).filter(p => c.porPais[p].length === 1);
        return cuantas({
          clave: 'cuantos-paises', valor: n,
          pregunta: '¿De cuántos países distintos son las películas que se han visto en los findes?',
          explicacion: `${n}. Con una sola película: ${yLista(raros)}.`, href: '#estadisticas' });
      },
      // La única de su país: curiosidades como Filipinas o Irán.
      paisUnico(c) {
        const p = azar(Object.keys(c.porPais).filter(x => c.porPais[x].length === 1));
        if (!p) return null;
        const e = c.porPais[p][0];
        // «A Serbian Film» de Serbia se contesta sola.
        if (normTitulo(`${e.peli.titulo_es} ${e.peli.titulo_original}`).includes(normTitulo(p).slice(0, 5))) return null;
        const otras = distractores(c.conFicha.filter(x => paisesDe(x.peli).length && !paisesDe(x.peli).includes(p)), 3,
          x => cerca(x, anioDe(e), 8));
        if (otras.length < 3) return null;
        return {
          clave: 'pais-unico', tipo: 'Cifras', pelis: [e.slug],
          pregunta: `Solo una película de los findes es de <strong>${p}</strong>. ¿Cuál?`,
          poster: null,
          opciones: [etq(e), ...otras.map(etq)],
          correcta: etq(e),
          explicacion: `${conAnio(e)}${paisesDe(e.peli).length > 1 ? `, coproducción de ${yLista(paisesDe(e.peli))}` : ''}. La trajo ${laTrajo(e)}.`,
          href: `#pelicula/${e.slug}`
        };
      },
      decadaMas(c) {
        const cuenta = {};
        for (const e of c.conAnio) cuenta[decadaEtiqueta(e)] = (cuenta[decadaEtiqueta(e)] || 0) + 1;
        return ranking({
          clave: 'mas-decada', pregunta: '¿De qué década son más películas de las vistas en los findes?',
          cuenta, fmt: n => pl(n, 'película', 'películas'), href: () => '#decadas' });
      },
      antesDe1950(c) {
        const viejas = c.conAnio.filter(e => anioDe(e) < 1950).sort((a, b) => anioDe(a) - anioDe(b));
        return cuantas({
          clave: 'antes-1950', valor: viejas.length,
          pregunta: '¿Cuántas películas anteriores a 1950 se han visto en los findes?',
          explicacion: `${viejas.length}. La más antigua, ${conAnio(viejas[0])}.`, href: '#decadas' });
      },
      personaMasPaises: (c) => ranking({
        clave: 'persona-paises', tipo: 'Perfil', pregunta: '¿Quién ha traído películas de más países distintos?',
        cuenta: porPersona(c, es => new Set(es.flatMap(e => paisesDe(e.peli))).size),
        fmt: n => pl(n, 'país', 'países'), href: hrefPersona }),
      personaMasDePais(c) {
        const p = azar(Object.keys(GENTILICIO));
        return ranking({
          clave: `persona-pais-${p}`, tipo: 'Perfil', pregunta: `¿Quién ha traído más películas ${GENTILICIO[p]}?`,
          cuenta: porPersona(c, es => es.filter(e => paisesDe(e.peli).includes(p)).length),
          fmt: n => pl(n, 'película', 'películas'), href: hrefPersona });
      },
      personaFueraDeUSA: (c) => ranking({
        clave: 'persona-no-usa', tipo: 'Perfil',
        pregunta: '¿Quién trae, en proporción, más cine de fuera de Estados Unidos?',
        cuenta: porPersona(c, es => {
          const con = es.filter(e => paisesDe(e.peli).length);
          return Math.round(100 * con.filter(e => !paisesDe(e.peli).includes('Estados Unidos')).length / con.length);
        }, 15),
        fmt: n => `${n} %`, href: hrefPersona }),
      personaMasAntigua: (c) => ranking({
        clave: 'persona-antigua', tipo: 'Perfil', pregunta: '¿Quién trae, de media, las películas más antiguas?',
        cuenta: porPersona(c, es => -Math.round(media(es.filter(e => anioDe(e)).map(anioDe))), 15),
        fmt: n => `de media, de ${-n}`, href: hrefPersona }),
      personaMasReciente: (c) => ranking({
        clave: 'persona-reciente', tipo: 'Perfil', pregunta: '¿Quién trae, de media, las películas más recientes?',
        cuenta: porPersona(c, es => Math.round(media(es.filter(e => anioDe(e)).map(anioDe))), 15),
        fmt: n => `de media, de ${n}`, href: hrefPersona }),
      personaMasNota: (c) => ranking({
        clave: 'persona-nota', tipo: 'Perfil', pregunta: '¿Quién trae, de media, las películas mejor valoradas en TMDB?',
        cuenta: porPersona(c, es => Math.round(10 * media(es.filter(e => parseFloat(e.peli.tmdb_rating)).map(e => parseFloat(e.peli.tmdb_rating)))) / 10, 15),
        fmt: n => fmtRating(n), href: hrefPersona }),
      personaMasLarga: (c) => ranking({
        clave: 'persona-larga', tipo: 'Perfil', pregunta: '¿Quién trae, de media, las películas más largas?',
        cuenta: porPersona(c, es => Math.round(media(es.filter(e => minutos(e.peli) >= 40).map(e => minutos(e.peli)))), 15),
        fmt: n => `${n} min`, href: hrefPersona }),
      personaMasFindes: (c) => ranking({
        clave: 'persona-findes', tipo: 'Perfil', pregunta: '¿Quién ha ido a más findes?',
        cuenta: contar(c.findesDe), fmt: n => pl(n, 'finde', 'findes'), href: hrefPersona }),
      // El director que más gente distinta ha traído: el que pone de acuerdo.
      directorMasGente(c) {
        const quienes = {};
        for (const e of c.pelis) if (e.peli) for (const d of dirDe(e.peli)) (quienes[d] || (quienes[d] = new Set())).add(e.persona);
        const cuenta = Object.fromEntries(Object.entries(quienes).filter(([d]) => latino(d)).map(([d, s]) => [d, s.size]));
        return ranking({
          clave: 'director-gente', pregunta: '¿Qué director ha sido traído por más personas distintas?',
          cuenta, fmt: n => pl(n, 'persona', 'personas'), href: d => `#director/${encodeURIComponent(d)}` });
      },
      lugarMasFindes(c) {
        const cuenta = {};
        for (const f of DATA) for (const l of f.lugares) cuenta[l] = (cuenta[l] || 0) + 1;
        return ranking({
          clave: 'lugar-mas', pregunta: '¿En qué lugar se han celebrado más findes?',
          cuenta, fmt: n => pl(n, 'finde', 'findes'), href: l => `#lugar/${encodeURIComponent(l)}` });
      },
      // ── Quién es el especialista en tal género
      quienMasGenero(c) {
        const g = azar(Object.keys(GEN_VARIAS));
        return ranking({
          clave: `masgenero-${g}`, tipo: 'Perfil', pregunta: `¿Quién ha traído más ${GEN_VARIAS[g]}?`,
          cuenta: porPersona(c, es => es.filter(e => genresOf(e.peli).includes(g)).length),
          fmt: n => pl(n, 'película', 'películas'), href: hrefPersona });
      },
      // ── Récords del archivo
      recordArchivo(c) {
        const criterio = azar([
          { id: 'antigua', pool: c.conAnio, valor: anioDe, mayor: false, fmt: e => e.peli.year, que: 'más antigua' },
          { id: 'larga', pool: c.conDuracion, valor: e => minutos(e.peli), mayor: true, fmt: e => `${minutos(e.peli)} min`, que: 'más larga' },
          { id: 'corta', pool: c.conDuracion, valor: e => minutos(e.peli), mayor: false, fmt: e => `${minutos(e.peli)} min`, que: 'más corta' }
        ]);
        const orden = criterio.pool.slice().sort((a, b) => criterio.mayor
          ? criterio.valor(b) - criterio.valor(a)
          : criterio.valor(a) - criterio.valor(b));
        if (orden.length < 12 || criterio.valor(orden[0]) === criterio.valor(orden[1])) return null;
        const otras = muestra(orden.slice(1, 12), 3);
        const todas = [orden[0], ...otras].sort((a, b) => orden.indexOf(a) - orden.indexOf(b));
        return {
          clave: `record-${criterio.id}`,
          tipo: 'Récords', pelis: [orden[0].slug],
          pregunta: `¿Cuál es la película ${criterio.que} que se ha visto en los findes?`,
          poster: null,
          opciones: [etq(orden[0]), ...otras.map(etq)],
          correcta: etq(orden[0]),
          explicacion: todas.map(e => `${criterio.fmt(e)} · ${etq(e)}`).join('<br>'),
          href: `#pelicula/${orden[0].slug}`
        };
      }
    };

    // ── La película en sí: sinopsis, título y cartel
    const PELICULAS = {
      laSinopsis(c) {
        const e = azar(c.conSinopsis);
        if (!e) return null;
        // Fuera los repartos entre paréntesis y cualquier palabra del título,
        // que si no la sinopsis lo canta.
        let txt = e.peli.plot.replace(/\s*\([^)]*\)/g, '');
        const palabras = [e.peli.titulo_es, e.peli.titulo_original, e.titulo]
          .flatMap(t => (t || '').split(/[^\p{L}\p{N}]+/u))
          .filter(w => w.length >= 4);
        for (const w of new Set(palabras)) {
          // Sin lookbehind, que Safari no entiende hasta la 16.4.
          txt = txt.replace(new RegExp(`(^|[^\\p{L}\\p{N}])${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(?![\\p{L}\\p{N}])`, 'giu'), '$1___');
        }
        if (txt.length > 280) txt = txt.slice(0, 280).replace(/\s+\S*$/, '') + '…';
        const suyos = genresOf(e.peli).filter(g => g !== 'Drama');
        const otras = distractores(c.conFicha.filter(x => x.slug !== e.slug), 3,
          x => genresOf(x.peli).some(g => suyos.includes(g)));
        if (otras.length < 3) return null;
        return {
          clave: `sinopsis-${e.slug}`, pelis: [e.slug],
          tipo: 'La sinopsis',
          pregunta: `¿De qué película es esta sinopsis?<div class="quizp-cita">${escHtml(txt)}</div>`,
          poster: null,
          opciones: [etq(e), ...otras.map(etq)],
          correcta: etq(e),
          explicacion: `Es ${conAnio(e)}. La trajo ${laTrajo(e)}.`,
          href: `#pelicula/${e.slug}`
        };
      },

      // ── Título original ↔ título en España
      elTitulo(c) {
        const e = azar(c.conOriginal);
        if (!e) return null;
        const anio = anioDe(e);
        const otras = distractores(c.conOriginal.filter(x => x.slug !== e.slug), 3,
          x => Math.abs(anioDe(x) - anio) <= 10);
        if (otras.length < 3) return null;
        const corto = t => t.length > 60 ? t.slice(0, 57) + '…' : t;
        const orig = x => corto(x.peli.titulo_original);
        // A cara o cruz, en un sentido o en el otro.
        const haciaEspana = Math.random() < 0.5;
        return {
          clave: `titulo-${e.slug}`, pelis: [e.slug],
          tipo: 'El título',
          pregunta: haciaEspana
            ? `¿Con qué título se estrenó en España <em>${orig(e)}</em>?`
            : `¿Cuál es el título original de <em>${etq(e)}</em>?`,
          poster: null,
          opciones: haciaEspana ? [etq(e), ...otras.map(etq)] : [orig(e), ...otras.map(orig)],
          correcta: haciaEspana ? etq(e) : orig(e),
          explicacion: `<em>${orig(e)}</em> (${e.peli.year}) se conoce aquí como <em>${etq(e)}</em>.`,
          href: `#pelicula/${e.slug}`
        };
      },

      // ── Reconocer el cartel
      queCartel(c) {
        const e = azar(c.conPoster);
        if (!e) return null;
        const suyos = genresOf(e.peli).filter(g => g !== 'Drama');
