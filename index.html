        const otras = distractores(c.conFicha.filter(x => x.slug !== e.slug), 3,
          x => genresOf(x.peli).some(g => suyos.includes(g)));
        if (otras.length < 3) return null;
        return {
          clave: `cartel-${e.slug}`, pelis: [e.slug],
          tipo: 'El cartel',
          pregunta: `¿De qué película es este cartel?`,
          poster: e.peli.poster,
          opciones: [etq(e), ...otras.map(etq)],
          correcta: etq(e),
          explicacion: `Es ${conAnio(e)}${e.peli.director ? `, de ${e.peli.director}` : ''}.`,
          href: `#pelicula/${e.slug}`
        };
      }
    };

    // ── Quién trajo qué, sin acordarse de números de finde
    const GENTE = {
      quienTrajo(c) {
        const e = azar(c.unaSolaVez);
        if (!e) return null;
        const { persona: correcta, finde: f } = e.apariciones[0];
        // Solo gente que estuvo ese finde: si no, Mario y Olmo se descartan solos.
        const otras = muestra(f.personas.map(p => p.nombre).filter(n => n !== correcta), 3);
        if (otras.length < 3) return null;
        return {
          clave: `quien-${e.slug}`, pelis: [e.slug],
          tipo: 'Quién la trajo',
          pregunta: `¿Quién trajo <em>${etq(e)}</em>${e.peli && e.peli.year ? ` (${e.peli.year})` : ''}?`,
          poster: e.peli && e.peli.poster,
          opciones: [correcta, ...otras],
          correcta,
          explicacion: `La trajo <strong>${correcta}</strong> al Finde #${f.numero} (${f.fecha}), en ${f.lugares.join(' y ')}.`,
          href: `#pelicula/${e.slug}`
        };
      },

      // ── Tres películas de la misma persona, de findes distintos
      lasTresDe(c) {
        const p = azar(c.personas);
        const suyas = c.unaSolaVez.filter(e => e.apariciones[0].persona === p);
        const porFinde = new Map();
        for (const e of barajar(suyas)) if (!porFinde.has(e.apariciones[0].finde.numero)) porFinde.set(e.apariciones[0].finde.numero, e);
        const tres = muestra([...porFinde.values()], 3);
        if (tres.length < 3) return null;
        // Distractores: gente que coincidió con ella en alguno de esos findes.
        const coincidieron = new Set(tres.flatMap(e => e.apariciones[0].finde.personas.map(x => x.nombre)));
        coincidieron.delete(p);
        const otras = muestra([...coincidieron], 3);
        if (otras.length < 3) return null;
        return {
          clave: `tres-${p}`, sobre: p, pelis: tres.map(e => e.slug),
          tipo: 'Quién las trajo',
          pregunta: `¿Quién trajo ${yLista(tres.map(e => `<em>${etq(e)}</em>`))}?`,
          poster: null,
          opciones: [p, ...otras],
          correcta: p,
          explicacion: `Las trajo <strong>${p}</strong>: ${tres.map(e => `<em>${etq(e)}</em> al Finde #${e.apariciones[0].finde.numero}`).join(', ')}.`,
          href: hrefPersona(p)
        };
      },

      // ── La que se vio dos veces
      laRepetida(c) {
        const e = azar(c.unicas.filter(x => new Set(x.apariciones.map(a => a.finde.numero)).size >= 2));
        const otras = muestra(c.unaSolaVez, 3);
        if (!e || otras.length < 3) return null;
        return {
          clave: `repetida-${e.slug}`, pelis: [e.slug],
          tipo: 'La repetida',
          pregunta: '¿Cuál de estas se ha visto en dos findes distintos?',
          poster: null,
          opciones: [etq(e), ...otras.map(etq)],
          correcta: etq(e),
          explicacion: `<em>${etq(e)}</em> se vio ${e.apariciones.map(a => `en el Finde #${a.finde.numero} (la trajo ${a.persona})`).join(' y ')}.`,
          href: `#pelicula/${e.slug}`
        };
      }
    };

    // El banco de una ronda: unas cien preguntas, con un cupo por familia.
    // Sobre todo vínculos entre películas y cifras del archivo.
    const FAMILIAS = [
      { id: 'reparto', cupo: 9, gens: [personaComun('reparto'), VINCULOS.enCualTambien] },
      { id: 'comparte', cupo: 3, gens: [VINCULOS.comparteReparto] },
      { id: 'musica', cupo: 5, gens: [personaComun('musica')] },
      { id: 'foto', cupo: 5, gens: [personaComun('fotografia')] },
      { id: 'guion', cupo: 4, gens: [personaComun('guion')] },
      { id: 'actua', cupo: 3, gens: [VINCULOS.directorActua] },
      { id: 'director', cupo: 5, gens: [VINCULOS.mismoDirector] },
      { id: 'pais', cupo: 5, gens: [VINCULOS.mismoPais] },
      { id: 'tema', cupo: 4, gens: [VINCULOS.temaComun] },
      { id: 'ciudad', cupo: 4, gens: [VINCULOS.dondeTranscurren] },
      { id: 'intrusa', cupo: 7, gens: [VINCULOS.laIntrusa] },
      { id: 'cifras', cupo: 27, gens: Object.values(CIFRAS) },
      { id: 'peliculas', cupo: 9, gens: Object.values(PELICULAS) },
      { id: 'gente', cupo: 7, gens: Object.values(GENTE) }
    ];

    function construirBanco() {
      const c = contextoQuiz();
      const banco = [];
      const claves = new Set(), sobre = new Set(), usos = {};
      for (const fam of FAMILIAS) {
        // Se generan muchas candidatas y se quedan las mejores, con algo de
        // azar para que cada ronda sea distinta.
        const candidatas = [];
        // Las cifras salen siempre igual: tras media docena de repetidas, ese
        // generador ya no da más de sí y no se le vuelve a llamar.
        const repetidas = {}, vistas = new Set();
        for (let i = 0; i < fam.cupo * 8; i++) {
          const gen = Math.floor(Math.random() * fam.gens.length);
          if (repetidas[gen] >= 6) continue;
          const q = fam.gens[gen](c);
          // Opciones repetidas harían la pregunta ambigua.
          if (!q || q.opciones.length < 4 || new Set(q.opciones).size !== q.opciones.length) continue;
          if (vistas.has(q.clave)) { repetidas[gen] = (repetidas[gen] || 0) + 1; continue; }
          vistas.add(q.clave);
          candidatas.push({ ...q, gen, familia: fam.id, orden: (q.peso || 1) + Math.random() * 3 });
        }
        candidatas.sort((a, b) => b.orden - a.orden);
        // En las familias con varios generadores, que ninguno acapare.
        const tope = fam.gens.length > 1 ? Math.ceil(fam.cupo / fam.gens.length) + 1 : fam.cupo;
        const porGen = {};
        let puestas = 0;
        for (const q of candidatas) {
          if (puestas >= fam.cupo) break;
          if (claves.has(q.clave) || (q.sobre && sobre.has(q.sobre)) || (porGen[q.gen] || 0) >= tope) continue;
          if ((q.pelis || []).some(s => (usos[s] || 0) >= 2)) continue;
          claves.add(q.clave);
          if (q.sobre) sobre.add(q.sobre);
          for (const s of q.pelis || []) usos[s] = (usos[s] || 0) + 1;
          porGen[q.gen] = (porGen[q.gen] || 0) + 1;
          q.opciones = barajar(q.opciones);
          banco.push(q);
          puestas++;
        }
      }
      // Repartidas a lo largo de la ronda en proporción a su cupo, para que
      // una ronda de diez también mezcle vínculos y cifras.
      const posicion = new Map();
      const porFamilia = {};
      for (const q of barajar(banco)) (porFamilia[q.familia] || (porFamilia[q.familia] = [])).push(q);
      for (const qs of Object.values(porFamilia)) qs.forEach((q, i) => posicion.set(q, (i + Math.random()) / qs.length));
      return banco.sort((a, b) => posicion.get(a) - posicion.get(b));
    }

    function renderQuizPrecriticos() {
      // «Todas» es el banco entero, unas cien.
      const preguntas = construirBanco().slice(0, quizLargo());
      const sinFin = false;
      if (!preguntas.length) {
        document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
          ${quizCabecera('precriticos')}
          <div class="empty-state"><div class="empty-icon">${ico('film')}</div>
          <div class="empty-title">No hay datos suficientes</div></div>
        </div></section>`;
        return;
      }

      let actual = 0, aciertos = 0, respondidas = 0;
      const fallos = [];

      document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
        ${quizCabecera('precriticos')}
        <div class="quiz-arena" style="min-height:auto">
          ${quizMarcador()}
          <div class="quizp" id="quizp"></div>
        </div>
      </div></section>`;
      engancharModos();
      document.getElementById('quiz-terminar').addEventListener('click', () => resultado());

      const pintar = () => {
        const q = preguntas[actual];
        pintarMarcador(actual, preguntas.length, aciertos, respondidas, sinFin);
        document.getElementById('quizp').innerHTML = `
          <div class="quizp-card">
            <div class="quizp-kind">${q.tipo}</div>
            ${q.poster ? `<img class="quizp-poster" src="${posterUrl(q.poster, POSTER.md)}" alt="">` : ''}
            <div class="quizp-question">${q.pregunta}</div>
            <div class="quizp-options" id="quizp-options">
              ${q.opciones.map((o, i) => `<button class="quizp-option" data-op="${i}">
                <span class="letra">${'ABCD'[i]}</span><span>${o}</span>
              </button>`).join('')}
            </div>
            <div id="quizp-tras"></div>
          </div>`;

        document.querySelectorAll('#quizp-options .quizp-option').forEach(btn => {
          btn.addEventListener('click', () => responder(q, parseInt(btn.dataset.op)));
        });
      };

      const responder = (q, elegida) => {
        const botones = [...document.querySelectorAll('#quizp-options .quizp-option')];
        const idxCorrecta = q.opciones.indexOf(q.correcta);
        const acertada = elegida === idxCorrecta;
        if (acertada) aciertos++; else fallos.push(q);
        respondidas++;

        botones.forEach((b, i) => {
          b.disabled = true;
          if (i === idxCorrecta) b.classList.add('is-correct');
          else if (i === elegida) b.classList.add('is-wrong');
          else b.classList.add('is-dim');
        });

        const ultima = actual === preguntas.length - 1;
        pintarMarcador(actual, preguntas.length, aciertos, respondidas, sinFin);
        document.getElementById('quizp-tras').innerHTML = `
          <div class="quizp-feedback">
            <strong>${ico(acertada ? 'si' : 'no')} ${acertada ? 'Correcto' : 'Casi'}</strong> — ${q.explicacion}
            <div style="margin-top:.4rem"><a href="${q.href}">Ver ficha →</a></div>
          </div>
          <button class="quizp-next" id="quizp-next">${ultima ? 'Ver resultado' : 'Siguiente →'}</button>`;

        document.getElementById('quizp-next').addEventListener('click', () => {
          if (ultima) resultado();
          else { actual++; pintar(); }
        });
      };

      const resultado = () => {
        const pct = respondidas ? Math.round((aciertos / respondidas) * 100) : 0;
        const circ = 2 * Math.PI * 58;
        let emoji, msg;
        if (pct === 100) { emoji = ico('trofeo'); msg = 'Pleno. Te sabes el archivo de memoria.'; }
        else if (pct >= 70) { emoji = ico('film'); msg = 'Muy bien: has estado atento todos estos años.'; }
        else if (pct >= 40) { emoji = ico('film'); msg = 'Aprobado raspado. Toca repasar findes.'; }
        else { emoji = ico('dormido'); msg = '¿Seguro que no te dormías en las proyecciones?'; }

        pintarMarcador(respondidas, respondidas, aciertos, respondidas, sinFin, true);
        document.getElementById('quizp').innerHTML = `
          <div class="quiz-results" style="max-width:none;margin:0 auto">
            <div class="result-ico">${emoji}</div>
            <div class="quiz-score-ring">
              <svg width="140" height="140" viewBox="0 0 140 140">
                <circle class="ring-bg" cx="70" cy="70" r="58" fill="none" stroke-width="8" />
                <circle class="ring-fg" cx="70" cy="70" r="58" fill="none" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" />
              </svg>
              <div class="quiz-score-text">
                <div class="quiz-score-num">${aciertos}/${respondidas}</div>
                <div class="quiz-score-label">aciertos</div>
              </div>
            </div>
            <div style="font-family:var(--ff-display);font-size:1.1rem;margin-bottom:1rem">${msg}</div>
            <button class="quizp-next" id="quizp-otra" style="max-width:260px;margin:0 auto">${ico('bobina')}&ensp;Otra ronda</button>
            ${fallos.length ? `<div class="quizp-review">
              <h2 class="section-title" style="margin-top:1.5rem">Lo que se te escapó</h2>
              ${fallos.map(q => `<div class="quizp-review-item">
                <div class="quizp-review-q">${q.pregunta}</div>
                <div class="quizp-review-a">${q.correcta}</div>
              </div>`).join('')}
            </div>` : ''}
          </div>`;

        requestAnimationFrame(() => requestAnimationFrame(() => {
          const anillo = document.querySelector('.ring-fg');
          if (anillo) anillo.style.strokeDashoffset = circ - (pct / 100) * circ;
        }));
        document.getElementById('quizp-otra').addEventListener('click', renderQuizPrecriticos);
      };

      pintar();
    }

    /* ── Selector de modo ── */
    function quizModo() {
      return localStorage.getItem('fp-quiz-modo') === 'cine' ? 'cine' : 'precriticos';
    }

    // Largo de la ronda. Precríticos tiene un banco de unas cien: 10, 30 o
    // todas. Cine general: 10, 30, 100 o sin fin (hasta que uno se canse).
    const QUIZ_LARGOS = { precriticos: ['10', '30', 'todas'], cine: ['10', '30', '100', 'sinfin'] };
    const QUIZ_ROTULOS = { todas: 'Todas', sinfin: 'Sin fin' };
    function quizLargoClave(modo = quizModo()) {
      let v = null;
      try { v = localStorage.getItem('fp-quiz-largo'); } catch (e) {}
      const largos = QUIZ_LARGOS[modo];
      if (largos.includes(v)) return v;
      // El máximo de un modo vale como máximo del otro.
      if (['100', 'sinfin', 'todas'].includes(v)) return largos[largos.length - 1];
      return '30';
    }
    function quizLargo() {
      const v = quizLargoClave();
      return v === 'sinfin' || v === 'todas' ? Infinity : parseInt(v);
    }

    function quizCabecera(modo) {
      const largo = quizLargoClave(modo);
      return `<h1 class="page-heading" style="text-align:center">Quiz</h1>
        <div class="quiz-modes">
          <div class="segmented" id="quiz-modes">
            <button data-modo="precriticos" class="${modo === 'precriticos' ? 'is-active' : ''}">Precríticos</button>
            <button data-modo="cine" class="${modo === 'cine' ? 'is-active' : ''}">Cine general</button>
          </div>
          <div class="quiz-largo">Preguntas
            <div class="segmented" id="quiz-largo">
              ${QUIZ_LARGOS[modo].map(v => `<button data-largo="${v}" class="${v === largo ? 'is-active' : ''}">${QUIZ_ROTULOS[v] || v}</button>`).join('')}
            </div>
          </div>
        </div>`;
    }

    function engancharModos() {
      document.querySelectorAll('#quiz-modes button').forEach(b => {
        b.addEventListener('click', () => {
          if (b.dataset.modo === quizModo()) return;
          localStorage.setItem('fp-quiz-modo', b.dataset.modo);
          renderQuiz();
        });
      });
      document.querySelectorAll('#quiz-largo button').forEach(b => {
        b.addEventListener('click', () => {
          if (b.dataset.largo === quizLargoClave()) return;
          try { localStorage.setItem('fp-quiz-largo', b.dataset.largo); } catch (e) {}
          renderQuiz();
        });
      });
    }

    // Contador y barra, comunes a los dos modos. En las rondas sin fin la
    // barra no tiene final: muestra el porcentaje de aciertos.
    function quizMarcador() {
      return `<div class="quiz-progress"><span id="quiz-counter"></span>
          <button class="quiz-terminar" id="quiz-terminar">Terminar</button></div>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-bar" style="width:0%"></div></div>`;
    }

    function pintarMarcador(actual, total, aciertos, respondidas, sinFin, fin) {
      const cont = document.getElementById('quiz-counter');
      const barra = document.getElementById('quiz-bar');
      const terminar = document.getElementById('quiz-terminar');
      if (!cont) return;
      if (terminar) terminar.style.display = fin ? 'none' : '';
      if (sinFin) {
        cont.textContent = fin
          ? `${respondidas} respondidas · ${aciertos} ${aciertos === 1 ? 'acierto' : 'aciertos'}`
          : `Pregunta ${actual + 1} · ${aciertos} de ${respondidas}`;
        barra.style.width = `${respondidas ? (aciertos / respondidas) * 100 : 0}%`;
      } else {
        cont.textContent = fin ? `${respondidas} / ${total}` : `${actual + 1} / ${total}`;
        barra.style.width = `${fin ? 100 : (actual / total) * 100}%`;
      }
    }

    function renderQuiz() {
      if (quizModo() === 'cine') renderQuizCine();
      else renderQuizPrecriticos();
    }

    async function loadQuiz() {
      if (QUIZ_DATA) return QUIZ_DATA;
      try {
        const res = await fetch('quiz.json');
        if (res.ok) QUIZ_DATA = await res.json();
      } catch(e) {}
      return QUIZ_DATA || [];
    }

    /* ═══ Cine general: sí o no ═══
       Unas pocas preguntas escritas a mano (quiz.json) y el resto generadas
       de las fichas, siempre sobre películas que se han visto en los findes.
       Cada generador recibe la respuesta que tiene que salir (`si`), para
       poder repartir síes y noes a medias: si no, contestar siempre «sí»
       aprobaría. Las explicaciones van como texto plano. */
    const decadaDe = (anio) => Math.floor(anio / 10) * 10;
    const nombreDecada = (d) => d < 2000 ? `${String(d).slice(2)}` : String(d);

    const GENERADORES_CINE = [
      function siDirigio(c, si) {
        const e = azar(c.conDirector);
        if (!e) return null;
        const suyos = e.peli.director.split(', ');
        const d = si ? suyos[0] : azar(c.directores.filter(x => !suyos.includes(x)
          && c.pelisDeDirector[x].some(o => Math.abs(anioDe(o) - anioDe(e)) <= 12)));
        if (!d) return null;
        return {
          clave: `si-dir-${e.slug}-${d}`, pelicula_slug: e.slug, respuesta: si,
          pregunta: `¿Dirigió ${d} <em>${etq(e)}</em>?`,
          explicacion: `${etq(e)} (${e.peli.year}) es de ${e.peli.director}.`
        };
      },

      function siDecada(c, si) {
        const e = azar(c.conAnio);
        if (!e) return null;
        const real = decadaDe(anioDe(e));
        const d = si ? real : real + azar([-10, 10]);
        if (d < 1920 || d > 2020) return null;
        return {
          clave: `si-decada-${e.slug}`, pelicula_slug: e.slug, respuesta: si,
          pregunta: `¿Es <em>${etq(e)}</em> de los años ${nombreDecada(d)}?`,
          explicacion: `Es de ${e.peli.year}${e.peli.director ? `, de ${e.peli.director}` : ''}.`
        };
      },

      function siDosHoras(c, si) {
        // Nada entre 110 y 130 minutos: eso no lo sabe nadie de memoria.
        const e = azar(c.conDuracion.filter(x => si ? minutos(x.peli) > 130 : minutos(x.peli) < 110));
        if (!e) return null;
        return {
          clave: `si-horas-${e.slug}`, pelicula_slug: e.slug, respuesta: si,
          pregunta: `¿Dura <em>${etq(e)}</em> más de dos horas?`,
          explicacion: `Dura ${minutos(e.peli)} minutos.`
        };
      },

      function siGenero(c, si) {
        let e, g;
        if (si) {
          e = azar(c.conFicha.filter(x => genresOf(x.peli).some(y => GEN_NITIDOS.includes(y))));
          if (!e) return null;
          g = azar(genresOf(e.peli).filter(y => GEN_NITIDOS.includes(y)));
        } else {
          g = azar(GEN_NITIDOS);
          e = azar(c.conFicha.filter(x => genresOf(x.peli).length && sinGenero(x.peli, g)));
          if (!e) return null;
        }
        return {
          clave: `si-genero-${e.slug}-${g}`, pelicula_slug: e.slug, respuesta: si,
          pregunta: `¿Es <em>${etq(e)}</em> ${GEN_UNA[g]}?`,
          explicacion: `En TMDB figura como ${genresOf(e.peli).join(', ').toLowerCase()}.`
        };
      },

      function siAnterior(c, si) {
        const [a, b] = muestra(c.conAnio, 2);
        if (!b || Math.abs(anioDe(a) - anioDe(b)) < 3) return null;
        // Se pregunta por la pareja en el orden que haga verdadera o falsa la frase.
        const [x, y] = (anioDe(a) < anioDe(b)) === si ? [a, b] : [b, a];
        return {
          clave: `si-antes-${[a.slug, b.slug].sort().join('|')}`, pelicula_slug: x.slug, respuesta: si,
          pregunta: `¿Es <em>${etq(x)}</em> anterior a <em>${etq(y)}</em>?`,
          explicacion: `${etq(x)} es de ${x.peli.year}; ${etq(y)}, de ${y.peli.year}.`
        };
      },

      function siTituloOriginal(c, si) {
        const e = azar(c.conOriginal);
        if (!e) return null;
        const otra = si ? e : azar(c.conOriginal.filter(x => x.slug !== e.slug
          && decadaDe(anioDe(x)) === decadaDe(anioDe(e))));
        if (!otra) return null;
        return {
          clave: `si-titulo-${e.slug}`, pelicula_slug: e.slug, respuesta: si,
          pregunta: `¿Es «${otra.peli.titulo_original}» el título original de <em>${etq(e)}</em>?`,
          explicacion: `Su título original es «${e.peli.titulo_original}»${si ? '' : `; «${otra.peli.titulo_original}» es ${etq(otra)}`}.`
        };
      },

      function siMismoDirector(c, si) {
        let a, b;
        if (si) {
          const d = azar(Object.keys(c.pelisDeDirector).filter(x => c.pelisDeDirector[x].length >= 2));
          if (!d) return null;
          [a, b] = muestra(c.pelisDeDirector[d], 2);
        } else {
          a = azar(c.conDirector);
          const suyos = a.peli.director.split(', ');
          b = azar(c.conDirector.filter(x => !x.peli.director.split(', ').some(d => suyos.includes(d))
            && Math.abs(anioDe(x) - anioDe(a)) <= 8));
          if (!b) return null;
        }
        const comun = a.peli.director.split(', ').find(d => b.peli.director.split(', ').includes(d));
        return {
          clave: `si-mismodir-${[a.slug, b.slug].sort().join('|')}`, pelicula_slug: a.slug, respuesta: si,
          pregunta: `¿Son <em>${etq(a)}</em> y <em>${etq(b)}</em> del mismo director?`,
          explicacion: si
            ? `Las dos son de ${comun}.`
            : `${etq(a)} es de ${a.peli.director}; ${etq(b)}, de ${b.peli.director}.`
        };
      }
    ];

    // `estado` se comparte entre tandas de una ronda sin fin: ni preguntas
    // ni películas repetidas en toda la partida.
    function rondaCine(curadas, n, estado = { vistas: new Set(), pelis: new Set() }) {
      const c = contextoQuiz();
      const ronda = [];
      const { vistas, pelis } = estado;
      const porTipo = {};
      // Las escritas a mano solo valen si su ficha existe; unas pocas por tanda.
      const curadasLibres = curadas.filter(q => (!q.pelicula_slug || PELI_CACHE[q.pelicula_slug])
        && !vistas.has(q.pregunta) && !pelis.has(q.pelicula_slug));
      for (const q of muestra(curadasLibres, Math.max(3, Math.round(n / 10)))) {
        ronda.push(q);
        vistas.add(q.pregunta);
        pelis.add(q.pelicula_slug);
      }
      const sies = Math.random() < 0.5 ? Math.floor(n / 2) : Math.ceil(n / 2);
      for (let i = 0; i < n * 40 && ronda.length < n; i++) {
        const faltanSi = sies - ronda.filter(q => q.respuesta).length;
        const si = faltanSi > 0 && (faltanSi >= n - ronda.length || Math.random() < 0.5);
        const gen = azar(GENERADORES_CINE);
        // Pocas del mismo tipo (tres en quince), para que no sea monotemática.
        if ((porTipo[gen.name] || 0) >= Math.max(3, Math.ceil(n / 5))) continue;
        const q = gen(c, si);
        if (!q || vistas.has(q.clave)) continue;
        // Una sola pregunta por película en toda la partida.
        if (pelis.has(q.pelicula_slug)) continue;
        vistas.add(q.clave);
        pelis.add(q.pelicula_slug);
        porTipo[gen.name] = (porTipo[gen.name] || 0) + 1;
        ronda.push(q);
      }
      return barajar(ronda);
    }

    async function renderQuizCine() {
      const total = quizLargo();
      const sinFin = total === Infinity;
      const curadas = await loadQuiz();
      const estado = { vistas: new Set(), pelis: new Set() };
      const shuffled = rondaCine(curadas, sinFin ? 20 : total, estado);
      if (!shuffled.length) {
        document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
          ${quizCabecera('cine')}
          <p style="color:var(--tx-2);text-align:center">No se pudieron cargar las preguntas.</p>
        </div></section>`;
        return;
      }

      let current = 0;
      let score = 0;
      let answered = false;
      let respondidas = 0;
      let terminado = false;

      function renderShell() {
        document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
          ${quizCabecera('cine')}
          <div class="quiz-arena">
            ${quizMarcador()}
            <div class="quiz-card-wrapper" id="quiz-card-wrapper"></div>
            <div class="quiz-buttons">
              <button class="quiz-btn btn-no" id="btn-no" title="No">${ico('no')}</button>
              <button class="quiz-btn btn-yes" id="btn-yes" title="Sí">${ico('si')}</button>
            </div>
            <div style="margin-top:1rem">
              <div class="quiz-swipe-hint">← NO &nbsp;·&nbsp; SÍ →</div>
            </div>
          </div>
        </div></section>`;
        engancharModos();
        document.getElementById('quiz-terminar').addEventListener('click', () => {
          if (!terminado) showResults();
        });
      }

      function showCard() {
        answered = false;
        const q = shuffled[current];
        const peli = q.pelicula_slug ? PELI_CACHE[q.pelicula_slug] : null;
        const wrapper = document.getElementById('quiz-card-wrapper');
        pintarMarcador(current, shuffled.length, score, respondidas, sinFin);

        const posterHtml = peli && peli.poster
          ? `<img class="quiz-card-poster" src="${posterUrl(peli.poster, POSTER.md)}" alt="" draggable="false">`
          : `<div class="quiz-card-poster-ph">${ico('film')}</div>`;

        wrapper.innerHTML = `
          <div class="quiz-card" id="quiz-active-card">
            <div class="quiz-overlay yes-label" id="overlay-yes">SÍ</div>
            <div class="quiz-overlay no-label" id="overlay-no">NO</div>
            ${posterHtml}
            <div class="quiz-card-question">${q.pregunta}</div>
          </div>
          <div class="quiz-feedback" id="quiz-feedback">
            <div class="quiz-feedback-icon" id="fb-icon"></div>
            <div class="quiz-feedback-text" id="fb-text"></div>
            <div class="quiz-feedback-explain" id="fb-explain"></div>
          </div>
        `;

        setupSwipe(document.getElementById('quiz-active-card'));
      }

      function answer(userSaidYes) {
        if (answered) return;
        answered = true;
        const q = shuffled[current];
        const correct = (userSaidYes === q.respuesta);
        if (correct) score++;
        respondidas++;
        pintarMarcador(current, shuffled.length, score, respondidas, sinFin);
        if (sinFin && current >= shuffled.length - 3) shuffled.push(...rondaCine(curadas, 20, estado));

        const card = document.getElementById('quiz-active-card');
        card.classList.add(userSaidYes ? 'exit-right' : 'exit-left');

        // Show feedback after card exits
        setTimeout(() => {
          const fb = document.getElementById('quiz-feedback');
          document.getElementById('fb-icon').innerHTML = ico(correct ? 'si' : 'no');
          document.getElementById('fb-text').textContent = correct ? '¡Correcto!' : 'Incorrecto';
          document.getElementById('fb-explain').textContent = q.explicacion;
          fb.classList.add('visible');

          // Auto-advance (salvo si ya se terminó o se cambió de página)
          setTimeout(() => {
            if (terminado || !document.getElementById('quiz-card-wrapper')) return;
            current++;
            if (current < shuffled.length) {
              showCard();
            } else {
              showResults();
            }
          }, 2000);
        }, 350);
      }

      function showResults() {
        // `answered` bloquea también los atajos de teclado de esta ronda.
        terminado = true;
        answered = true;
        document.querySelectorAll('.quiz-buttons, .quiz-swipe-hint').forEach(el => el.style.display = 'none');
        const pct = respondidas ? Math.round((score / respondidas) * 100) : 0;
        const circ = 2 * Math.PI * 58;
        const offset = circ - (pct / 100) * circ;

        let emoji, msg;
        if (pct === 100) { emoji = ico('trofeo'); msg = '¡Perfecto! Eres un auténtico cinéfilo precrítico.'; }
        else if (pct >= 75) { emoji = ico('film'); msg = '¡Muy bien! Dominas el archivo.'; }
        else if (pct >= 50) { emoji = ico('film'); msg = 'No está mal, pero hay margen de mejora.'; }
        else { emoji = ico('camara'); msg = 'Necesitas más findes precríticos...'; }

        const wrapper = document.getElementById('quiz-card-wrapper');
        wrapper.style.height = 'auto';
        wrapper.innerHTML = `
          <div class="quiz-results">
            <div class="result-ico">${emoji}</div>
            <div class="quiz-score-ring">
              <svg width="140" height="140" viewBox="0 0 140 140">
                <circle class="ring-bg" cx="70" cy="70" r="58" fill="none" stroke-width="8" />
                <circle class="ring-fg" cx="70" cy="70" r="58" fill="none" stroke-width="8"
                  stroke-linecap="round"
                  stroke-dasharray="${circ}"
                  stroke-dashoffset="${circ}" />
              </svg>
              <div class="quiz-score-text">
                <div class="quiz-score-num">${score}/${respondidas}</div>
                <div class="quiz-score-label">aciertos</div>
              </div>
            </div>
            <div style="font-family:var(--ff-display);font-size:1.1rem;color:var(--tx);margin-bottom:.5rem">${msg}</div>
            <div style="display:flex;gap:.75rem;justify-content:center;margin-top:1rem">
              <button class="quiz-btn btn-yes" id="quiz-retry" title="Reintentar" style="width:auto;border-radius:8px;padding:.6rem 1.2rem;font-size:.88rem;font-weight:600;font-family:var(--ff-body)">
                ${ico('bobina')}&ensp;Reintentar
              </button>
              <a href="#" class="quiz-btn btn-no" style="width:auto;border-radius:8px;padding:.6rem 1.2rem;font-size:.88rem;font-weight:600;font-family:var(--ff-body);text-decoration:none;display:flex;align-items:center">
                Inicio
              </a>
            </div>
          </div>
        `;

        pintarMarcador(respondidas, shuffled.length, score, respondidas, sinFin, true);

        // Animate ring
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.querySelector('.ring-fg').style.strokeDashoffset = offset;
          });
        });

        document.getElementById('quiz-retry').addEventListener('click', () => {
          renderQuizCine();
        });
      }

      // Swipe engine
      function setupSwipe(card) {
        let startX = 0, startY = 0, deltaX = 0, isDragging = false, startTime = 0;
        const THRESHOLD = 80;
        const overlayYes = document.getElementById('overlay-yes');
        const overlayNo = document.getElementById('overlay-no');

        function onStart(e) {
          if (answered) return;
          isDragging = true;
          startTime = Date.now();
          const point = e.touches ? e.touches[0] : e;
          startX = point.clientX;
          startY = point.clientY;
          card.style.transition = 'none';
        }

        function onMove(e) {
          if (!isDragging || answered) return;
          const point = e.touches ? e.touches[0] : e;
          deltaX = point.clientX - startX;
          const deltaY = point.clientY - startY;

          // If vertical movement is dominant, don't hijack scroll
          if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaX) < 10) return;
          if (Math.abs(deltaX) > 10) e.preventDefault();

          const rotation = deltaX * 0.08;
          card.style.transform = `translateX(${deltaX}px) rotate(${rotation}deg)`;

          const progress = Math.min(Math.abs(deltaX) / THRESHOLD, 1);
          if (deltaX > 0) {
            overlayYes.style.opacity = progress;
            overlayNo.style.opacity = 0;
            card.classList.add('swiping-right');
            card.classList.remove('swiping-left');
          } else if (deltaX < 0) {
            overlayNo.style.opacity = progress;
            overlayYes.style.opacity = 0;
            card.classList.add('swiping-left');
            card.classList.remove('swiping-right');
          } else {
            overlayYes.style.opacity = 0;
            overlayNo.style.opacity = 0;
          }
        }

        function onEnd() {
          if (!isDragging || answered) return;
          isDragging = false;

          // Velocity-based: allow fast flicks with shorter distance
          const elapsed = Date.now() - startTime;
          const velocity = Math.abs(deltaX) / elapsed;
          const isFlick = velocity > 0.5 && Math.abs(deltaX) > 30;

          if (Math.abs(deltaX) >= THRESHOLD || isFlick) {
            answer(deltaX > 0);
          } else {
            // Snap back
            card.style.transition = 'transform .3s var(--ease-out-quart)';
            card.style.transform = '';
            overlayYes.style.opacity = 0;
            overlayNo.style.opacity = 0;
            card.classList.remove('swiping-right', 'swiping-left');
          }
          deltaX = 0;
        }

        // Touch events
        card.addEventListener('touchstart', onStart, { passive: true });
        card.addEventListener('touchmove', onMove, { passive: false });
        card.addEventListener('touchend', onEnd);

        // Mouse events
        card.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
      }

      // Init
      renderShell();
      showCard();

      // Button handlers
      document.getElementById('btn-no').addEventListener('click', () => answer(false));
      document.getElementById('btn-yes').addEventListener('click', () => answer(true));

      // Keyboard support
      const keyHandler = (e) => {
        if (location.hash !== '#quiz') {
          document.removeEventListener('keydown', keyHandler);
          return;
        }
        if (e.key === 'ArrowLeft') answer(false);
        else if (e.key === 'ArrowRight') answer(true);
      };
      document.addEventListener('keydown', keyHandler);
    }

    /* ── Fuzzy Search Engine ── */
    let SEARCH_INDEX = [];

    function normalize(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function fuzzyScore(query, target) {
      const q = normalize(query), t = normalize(target);
      if (!q) return 0;
      const subIdx = t.indexOf(q);
      if (subIdx === 0) return 10000 + (1000 - t.length);
      if (subIdx > 0) return 5000 + (1000 - subIdx);
      const words = t.split(/\s+/), qWords = q.split(/\s+/);
      let wordScore = 0;
      for (const qw of qWords) for (const tw of words) {
        if (tw.startsWith(qw)) wordScore += 2000;
        else if (tw.includes(qw)) wordScore += 1000;
      }
      if (wordScore > 0) return wordScore;
      let qi = 0, consecutive = 0, score = 0, firstMatch = -1;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) {
          if (firstMatch < 0) firstMatch = ti;
          consecutive++;
          score += consecutive * 10 + (ti === 0 ? 50 : 0);
          if (ti === 0 || ' .-_'.includes(t[ti - 1])) score += 30;
          qi++;
        } else { consecutive = 0; }
      }
      if (qi < q.length) return 0;
      return score - firstMatch;
    }

    function buildSearchIndex() {
      SEARCH_INDEX = [];
      const seenDirectors = new Set(), seenSlugs = new Set();
      for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
        const titulo = typeof m === 'string' ? m : m.titulo;
        const slug = typeof m === 'string' ? null : m.slug;
        if (!slug || seenSlugs.has(slug)) continue;
        seenSlugs.add(slug);
        const peli = PELI_CACHE[slug];
        const searchFields = [titulo];
        let sub = `${p.nombre} · Finde #${f.numero}`;
        let poster = null;
        if (peli) {
          if (peli.titulo_original && peli.titulo_original !== titulo) searchFields.push(peli.titulo_original);
          if (peli.titulo_es && peli.titulo_es !== titulo) searchFields.push(peli.titulo_es);
          if (peli.director) { searchFields.push(peli.director); sub = `${peli.director} (${peli.year || '?'}) · ${p.nombre}`; }
          if (peli.genre) searchFields.push(peli.genre);
          if (peli.year) searchFields.push(peli.year);
          poster = peli.poster;
          if (peli.director) for (const d of peli.director.split(', ')) {
            if (!seenDirectors.has(d)) {
              seenDirectors.add(d);
              const dirPelis = [];
              for (const [s, pd] of Object.entries(PELI_CACHE)) {
                if (pd && pd.director && pd.director.includes(d)) dirPelis.push(pd.titulo);
              }
              SEARCH_INDEX.push({ type:'director', label:d, sub:`${dirPelis.length} peli${dirPelis.length>1?'s':''}: ${dirPelis.slice(0,3).join(', ')}${dirPelis.length>3?'…':''}`, search:d, href:`#director/${encodeURIComponent(d)}`, poster:null, boost:1 });
            }
          }
        }
        SEARCH_INDEX.push({ type:'pelicula', label:titulo, sub, search:searchFields.join(' '), href:`#pelicula/${slug}`, poster, boost:3 });
      }
      for (const name of [...new Set(DATA.flatMap(f => f.personas.map(p => p.nombre)))]) {
        const count = DATA.reduce((s, f) => s + (f.personas.some(p => p.nombre === name) ? 1 : 0), 0);
        SEARCH_INDEX.push({ type:'persona', label:name, sub:`${count} findes`, search:name, href:`#persona/${encodeURIComponent(name)}`, poster:null, boost:2 });
      }
      for (const l of [...new Set(DATA.flatMap(f => f.lugares))]) {
        const count = DATA.filter(f => f.lugares.includes(l)).length;
        SEARCH_INDEX.push({ type:'lugar', label:l, sub:`${count} findes`, search:l, href:`#lugar/${encodeURIComponent(l)}`, poster:null, boost:2 });
      }
      const generos = {};
      for (const [slug, p] of Object.entries(PELI_CACHE)) {
        if (!p || !seenSlugs.has(slug)) continue;
        for (const g of genresOf(p)) generos[g] = (generos[g] || 0) + 1;
      }
      for (const [g, n] of Object.entries(generos)) {
        SEARCH_INDEX.push({ type:'genero', label:g, sub:`${n} película${n !== 1 ? 's' : ''}`, search:g, href:`#genero/${encodeURIComponent(g)}`, poster:null, boost:1 });
      }
      for (const f of DATA) {
        SEARCH_INDEX.push({ type:'finde', label:`Finde #${f.numero}`, sub:`${f.fecha} · ${f.lugares.join(', ')}`, search:`Finde ${f.numero} ${f.fecha} ${f.lugares.join(' ')}`, href:`#finde/${f.numero}`, poster:null, boost:1 });
      }
    }

    const SR_LABEL = { pelicula:'Película', persona:'Persona', lugar:'Lugar', finde:'Finde', director:'Director', genero:'Género' };

    /* ── Search UI ── */
    let searchSelectedIdx = -1;

    function setupSearch() {
      const input = document.getElementById('global-search');
      const results = document.getElementById('search-results');
      let debounceTimer;
      input.addEventListener('input', () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => doSearch(input.value), 80); });
      input.addEventListener('keydown', (e) => {
        const items = results.querySelectorAll('.sr-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); searchSelectedIdx = Math.min(searchSelectedIdx + 1, items.length - 1); highlightItem(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); searchSelectedIdx = Math.max(searchSelectedIdx - 1, -1); highlightItem(items); }
        else if (e.key === 'Enter' && searchSelectedIdx >= 0 && items[searchSelectedIdx]) { e.preventDefault(); items[searchSelectedIdx].click(); }
        else if (e.key === 'Escape') { results.classList.remove('open'); input.blur(); }
      });
      document.addEventListener('click', (e) => { if (!e.target.closest('.search-wrap')) results.classList.remove('open'); });
      input.addEventListener('focus', () => { if (input.value.length >= 2) doSearch(input.value); });
    }

    function highlightItem(items) {
      items.forEach((el, i) => el.classList.toggle('selected', i === searchSelectedIdx));
      if (items[searchSelectedIdx]) items[searchSelectedIdx].scrollIntoView({ block: 'nearest' });
    }

    function doSearch(query) {
      const results = document.getElementById('search-results');
      if (query.length < 2) { results.classList.remove('open'); return; }
      const scored = new Map();
      for (const item of SEARCH_INDEX) {
        const labelScore = fuzzyScore(query, item.label) * item.boost * 2;
        const fullScore = fuzzyScore(query, item.search) * item.boost;
        const score = Math.max(labelScore, fullScore);
        if (score > 0) {
          const existing = scored.get(item.href);
          if (!existing || score > existing.score) scored.set(item.href, { ...item, score });
        }
      }
      const matches = [...scored.values()].sort((a, b) => b.score - a.score).slice(0, 15);
      searchSelectedIdx = -1;
      if (matches.length === 0) {
        results.innerHTML = '<div style="padding:.85rem;color:var(--tx-3);font-size:.88rem">Sin resultados</div>';
        results.classList.add('open');
        return;
      }
      results.innerHTML = matches.map((m, i) => {
        const posterHtml = m.poster
          ? `<img src="${posterUrl(m.poster, POSTER.xs)}" alt="" loading="lazy">`
          : `<div class="sr-placeholder">${ico({pelicula:'film',persona:'persona',lugar:'lugar',finde:'fecha',director:'camara',genero:'genero'}[m.type] || 'film')}</div>`;
        return `<div class="sr-item" data-href="${m.href}" data-idx="${i}">
          ${posterHtml}
          <div class="sr-text"><div class="sr-title">${highlightMatch(m.label, query)}</div><div class="sr-sub">${m.sub}</div></div>
          <span class="sr-type ${m.type}">${SR_LABEL[m.type] || m.type}</span>
        </div>`;
      }).join('');
      results.classList.add('open');
      results.querySelectorAll('.sr-item').forEach(el => {
        el.addEventListener('click', () => { location.hash = el.dataset.href; results.classList.remove('open'); document.getElementById('global-search').value = ''; });
      });
    }

    function highlightMatch(text, query) {
      const q = normalize(query), tNorm = normalize(text);
      const idx = tNorm.indexOf(q);
      if (idx >= 0) return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
      let result = '', qi = 0;
      for (let i = 0; i < text.length; i++) {
        if (qi < q.length && normalize(text[i]) === q[qi]) { result += '<mark>' + text[i] + '</mark>'; qi++; }
        else result += text[i];
      }
      return result;
    }

    init();
  </script>
</body>
