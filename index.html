      const generosOrdenados = Object.entries(generos).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es'));

      document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Películas <span style="font-family:var(--ff-display);font-style:italic;font-size:.5em;color:var(--tx-3)">${films.length}</span></h1>
        <div class="page-sub">Cada película una vez, aunque la trajeran varios.</div>

        <div class="toolbar">
          <div class="field filter-input">
            <div class="control">
              <input class="input" type="search" id="peli-search" placeholder="Filtrar por título, director…" value="${peliView.texto}">
            </div>
          </div>
          <div class="select-wrap">
            <select id="peli-genero" aria-label="Filtrar por género">
              <option value="">Todos los géneros</option>
              ${generosOrdenados.map(([g, n]) => `<option value="${g}"${peliView.genero === g ? ' selected' : ''}>${g} (${n})</option>`).join('')}
            </select>
          </div>
          <div class="select-wrap">
            <select id="peli-orden" aria-label="Ordenar">
              <option value="titulo">A · Z</option>
              <option value="year-asc">Más antiguas</option>
              <option value="year-desc">Más recientes</option>
              <option value="rating">Mejor valoradas</option>
              <option value="duracion">Más largas</option>
            </select>
          </div>
          <div class="toolbar-spacer"></div>
          <div class="segmented" id="peli-vista">
            <button data-vista="lista">Lista</button>
            <button data-vista="rejilla">Rejilla</button>
          </div>
        </div>

        <div class="alpha-nav" id="alpha-nav"></div>
        <div id="films-list"></div>
      </div></section>`;

      document.getElementById('peli-orden').value = peliView.orden;
      document.querySelectorAll('#peli-vista button').forEach(b =>
        b.classList.toggle('is-active', b.dataset.vista === peliView.vista));

      const paint = () => paintPeliculas(films);
      paint();

      const search = document.getElementById('peli-search');
      let t;
      search.addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(() => { peliView.texto = search.value; peliView.letra = 'all'; paint(); }, 120);
      });
      document.getElementById('peli-genero').addEventListener('change', e => {
        peliView.genero = e.target.value; peliView.letra = 'all'; paint();
      });
      document.getElementById('peli-orden').addEventListener('change', e => {
        peliView.orden = e.target.value; peliView.letra = 'all'; paint();
      });
      document.querySelectorAll('#peli-vista button').forEach(btn => {
        btn.addEventListener('click', () => {
          peliView.vista = btn.dataset.vista;
          document.querySelectorAll('#peli-vista button').forEach(b =>
            b.classList.toggle('is-active', b === btn));
          paint();
        });
      });
    }

    function filterFilms(films) {
      const q = normalize(peliView.texto.trim());
      return films.filter(f => {
        if (peliView.genero && !genresOf(f.peli).includes(peliView.genero)) return false;
        if (peliView.letra !== 'all' && initialLetter(f.peli, f.titulo) !== peliView.letra) return false;
        if (!q) return true;
        const p = f.peli;
        const haystack = [f.titulo, p && p.titulo_original, p && p.titulo_es, p && p.director, p && p.year]
          .filter(Boolean).join(' ');
        return normalize(haystack).includes(q);
      });
    }

    function sortFilms(films) {
      const num = (v, def) => { const n = parseFloat(v); return isNaN(n) ? def : n; };
      const byTitle = (a, b) => sortKey(a.peli, a.titulo).localeCompare(sortKey(b.peli, b.titulo), 'es');
      switch (peliView.orden) {
        case 'year-asc':  return films.sort((a, b) => num(a.peli && a.peli.year, 9999) - num(b.peli && b.peli.year, 9999) || byTitle(a, b));
        case 'year-desc': return films.sort((a, b) => num(b.peli && b.peli.year, 0) - num(a.peli && a.peli.year, 0) || byTitle(a, b));
        case 'rating':    return films.sort((a, b) => num(b.peli && b.peli.tmdb_rating, -1) - num(a.peli && a.peli.tmdb_rating, -1) || byTitle(a, b));
        case 'duracion':  return films.sort((a, b) => num(b.peli && b.peli.runtime, -1) - num(a.peli && a.peli.runtime, -1) || byTitle(a, b));
        default:          return films.sort(byTitle);
      }
    }

    function paintPeliculas(allFilms) {
      const alphaNav = document.getElementById('alpha-nav');
      const list = document.getElementById('films-list');
      const alfabetico = peliView.orden === 'titulo';

      // La barra A-Z se calcula sobre el conjunto filtrado por texto/género,
      // no por letra: si no, elegir una letra vaciaría la propia barra.
      const letraPrevia = peliView.letra;
      peliView.letra = 'all';
      const sinLetra = filterFilms(allFilms);
      peliView.letra = letraPrevia;

      if (alfabetico) {
        const counts = {};
        for (const f of sinLetra) {
          const l = initialLetter(f.peli, f.titulo);
          counts[l] = (counts[l] || 0) + 1;
        }
        const letras = Object.keys(counts).sort();
        if (letraPrevia !== 'all' && !counts[letraPrevia]) peliView.letra = 'all';
        alphaNav.style.display = '';
        alphaNav.innerHTML = `<button class="alpha-pill${peliView.letra === 'all' ? ' is-active' : ''}" data-letter="all">Todos</button>`
          + letras.map(l => `<button class="alpha-pill${peliView.letra === l ? ' is-active' : ''}" data-letter="${l}">${l}</button>`).join('');
        alphaNav.querySelectorAll('.alpha-pill').forEach(btn => {
          btn.addEventListener('click', () => { peliView.letra = btn.dataset.letter; paintPeliculas(allFilms); });
        });
      } else {
        peliView.letra = 'all';
        alphaNav.style.display = 'none';
        alphaNav.innerHTML = '';
      }

      const films = sortFilms(filterFilms(allFilms));

      if (!films.length) {
        list.innerHTML = `<div class="empty-state">
          <div class="empty-icon">${ico('buscar')}</div>
          <div class="empty-title">Ninguna película encaja</div>
          <p>Prueba con otro título o quita algún filtro.</p>
        </div>`;
        return;
      }

      let html = `<div class="result-count mb-3">${films.length} película${films.length !== 1 ? 's' : ''}</div>`;

      if (peliView.vista === 'rejilla') {
        html += `<div class="poster-grid stagger">`;
        for (const [i, f] of films.entries()) {
          const anio = f.peli && f.peli.year ? f.peli.year : '';
          const quien = subLineFor(f);
          html += posterTile(f.slug, f.peli, [anio, quien].filter(Boolean).join(' · '), Math.min(i, 24));
        }
        html += `</div>`;
      } else {
        const porLetra = {};
        if (alfabetico) for (const f of films) {
          const l = initialLetter(f.peli, f.titulo);
          porLetra[l] = (porLetra[l] || 0) + 1;
        }
        let letraActual = '';
        for (const f of films) {
          if (alfabetico) {
            const l = initialLetter(f.peli, f.titulo);
            if (l !== letraActual) {
              letraActual = l;
              html += `<div class="alpha-heading" id="letter-${l}">${l} <span class="decade-count">${porLetra[l]}</span></div>`;
            }
          }
          const url = posterUrl(f.peli && f.peli.poster, POSTER.xs);
          const poster = url
            ? `<img class="film-poster-sm" src="${url}" alt="" loading="lazy">`
            : posterPh(plainTitle(f.peli, f.titulo), 'film-poster-ph');
          html += `<div class="film-row">
            ${poster}
            <div class="film-row-body">
              <div class="film-row-title"><a href="#pelicula/${f.slug}">${filmTitle(f.peli, f.titulo)}${f.peli && f.peli.year ? ` (${f.peli.year})` : ''}</a></div>
              <div class="film-row-sub">${subLineFor(f, true)}</div>
            </div>
          </div>`;
        }
      }
      list.innerHTML = html;
    }

    // Línea secundaria: quién la trajo y en qué finde (+ director en lista).
    function subLineFor(f, conDirector) {
      const apps = appearancesOf(f.slug);
      const quien = apps.map(a =>
        `<a href="#persona/${encodeURIComponent(a.persona)}">${a.persona}</a> · <a href="#finde/${a.finde.numero}">#${a.finde.numero}</a>`
      ).join(' / ');
      if (!conDirector) return apps.map(a => a.persona).join(' / ');
      const dir = f.peli && f.peli.director ? `${f.peli.director} — ` : '';
      return dir + quien;
    }

    /* ── PELÍCULA DETAIL ── */
    async function renderPelicula(slug) {
      const peli = await loadPeli(slug);
      if (!peli) { notFound('esa película', '#peliculas', 'Ver todas las películas'); return; }

      const appearances = [];
      for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
        if (typeof m !== 'string' && m.slug === slug) appearances.push({ finde: f, persona: p.nombre });
      }

      const orig = peli.titulo_original || peli.titulo;
      const es = peli.titulo_es || peli.titulo;
      const displayTitle = orig.toLowerCase() === es.toLowerCase()
        ? orig : `${orig} <span class="peli-es">(${es})</span>`;

      // Find other films by same director(s)
      const directorFilms = {};
      if (peli.director) {
        for (const d of peli.director.split(', ')) {
          directorFilms[d] = [];
          for (const [s, p] of Object.entries(PELI_CACHE)) {
            if (p && s !== slug && p.director && p.director.split(', ').includes(d)) {
              directorFilms[d].push({ slug: s, peli: p });
            }
          }
        }
      }

      // Find films from the same genre
      const genres = peli.genre ? peli.genre.split(', ').map(g => g.trim()) : [];
      const genreFilms = [];
      if (genres.length) {
        const primaryGenre = genres[0];
        for (const [s, p] of Object.entries(PELI_CACHE)) {
          if (p && s !== slug && p.genre && p.genre.includes(primaryGenre)) {
            const shared = genres.filter(g => p.genre.includes(g)).length;
            genreFilms.push({ slug: s, peli: p, shared });
          }
        }
        genreFilms.sort((a, b) => b.shared - a.shared);
      }

      // Find films from the same year
      const yearFilms = [];
      if (peli.year) {
        for (const [s, p] of Object.entries(PELI_CACHE)) {
          if (p && s !== slug && p.year === peli.year) yearFilms.push({ slug: s, peli: p });
        }
      }

      let html = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#peliculas', label:'Películas'}, {href:'#', label: orig}])}

        <div class="columns">
          <div class="column is-narrow" style="text-align:center">
      `;
      if (peli.poster) {
        html += `<img class="peli-poster-img" src="${posterUrl(peli.poster, POSTER.lg)}" alt="Cartel de ${peli.titulo}">`;
      }

      html += `</div><div class="column">
        <h1 class="peli-title">${displayTitle}</h1>
      `;

      // ── Year (linked to same-year films)
      if (peli.year) {
        const yearNote = yearFilms.length ? ` <span style="font-size:.78rem;font-style:normal;font-family:var(--ff-body);color:var(--tx-3)">(${yearFilms.length} más de este año)</span>` : '';
        html += `<div style="font-family:var(--ff-display);font-style:italic;font-size:1.2rem;color:var(--tx-2);margin-bottom:.5rem">${peli.year}${yearNote}</div>`;
      }

      // ── Director (navigable link)
      if (peli.director) {
        const dirLinks = peli.director.split(', ').map(d =>
          `<a href="#director/${encodeURIComponent(d)}" style="color:var(--wine);text-decoration:none;font-weight:500">${d}</a>`
        ).join(', ');
        html += `<div class="peli-line">${ico('camara')} ${dirLinks}</div>`;
      }

      // ── Runtime
      if (peli.runtime) {
        html += `<div class="peli-line peli-line-muted">${ico('reloj')} ${peli.runtime}</div>`;
      }

      // ── Genres (navigable tags)
      if (genres.length) {
        html += `<div class="tags mb-3">${genres.map(g =>
          `<a class="tag is-genre" href="#genero/${encodeURIComponent(g)}">${g}</a>`
        ).join('')}</div>`;
      }

      // ── Ratings
      if (peli.imdb_id || peli.tmdb_id || peli.tmdb_rating) {
        html += `<div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem">`;
        if (peli.tmdb_rating) {
          html += `<span class="peli-rating" style="cursor:default">${ico('estrella','class="ico ico-estrella"')} ${fmtRating(peli.tmdb_rating)} / 10</span>`;
        }
        if (peli.imdb_id) {
          html += `<a class="peli-rating" href="https://www.imdb.com/title/${peli.imdb_id}" target="_blank" rel="noopener" style="background:var(--gold-bg);color:var(--gold)">IMDb ↗</a>`;
        }
        if (peli.tmdb_id) {
          html += `<a class="peli-rating" href="https://www.themoviedb.org/movie/${peli.tmdb_id}" target="_blank" rel="noopener" style="background:var(--bg-inset);color:var(--tx-2)">TMDB ↗</a>`;
        }
        html += `</div>`;
      }

      // ── Plot
      if (peli.plot) {
        html += `<article class="message is-wine mt-4"><div class="message-body">${peli.plot}</div></article>`;
      }

      // ── Traída por / En los Findes
      html += `<h2 style="font-family:var(--ff-display);font-size:1.15rem;margin-top:1.5rem;margin-bottom:.75rem">En los Findes</h2>`;
      html += `<div class="stagger">`;
      for (const [i, a] of appearances.entries()) {
        html += `<div class="card mb-3" style="--i:${i}">
          <div class="card-content" style="display:flex;align-items:center;gap:.85rem;overflow:visible">
            <div class="persona-avatar" style="width:38px;height:38px;font-size:.95rem">${a.persona.charAt(0)}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:.9rem">
                Traída por <a href="#persona/${encodeURIComponent(a.persona)}">${a.persona}</a>
              </div>
              <div style="font-size:.78rem;color:var(--tx-3)">
                <a href="#finde/${a.finde.numero}" style="color:var(--tx-3)">Finde #${a.finde.numero}</a>
                · <span style="font-family:var(--ff-display);font-style:italic">${a.finde.fecha}</span>
                · ${a.finde.lugares.map(l => `<a href="#lugar/${encodeURIComponent(l)}" style="color:var(--tx-3)">${l}</a>`).join(', ')}
              </div>
            </div>
          </div>
        </div>`;
      }
      html += `</div>`;

      // ── Más del mismo director, mismo año y mismo género.
      //    Cada bloque excluye lo ya mostrado arriba para no repetir carteles.
      const yaMostrado = new Set([slug]);

      for (const [director, films] of Object.entries(directorFilms)) {
        const nuevas = films.filter(f => !yaMostrado.has(f.slug));
        if (!nuevas.length) continue;
        const visibles = nuevas.slice(0, 6);
        visibles.forEach(f => yaMostrado.add(f.slug));
        html += relatedGrid(
          `Más de <a href="#director/${encodeURIComponent(director)}">${director}</a>`,
          visibles,
          f => f.peli.year || '',
          nuevas.length > 6 ? `<a href="#director/${encodeURIComponent(director)}">Ver las ${films.length} películas →</a>` : ''
        );
      }

      const yearNuevas = yearFilms.filter(f => !yaMostrado.has(f.slug));
      if (yearNuevas.length) {
        const visibles = yearNuevas.slice(0, 6);
        visibles.forEach(f => yaMostrado.add(f.slug));
        html += relatedGrid(
          `También de ${peli.year}`,
          visibles,
          f => f.peli.director || '',
          yearNuevas.length > 6 ? `<span style="color:var(--tx-3)">y ${yearNuevas.length - 6} más del mismo año</span>` : ''
        );
      }

      const generoNuevas = genreFilms.filter(f => !yaMostrado.has(f.slug));
      if (generoNuevas.length) {
        html += relatedGrid(
          genres.length ? `Más <a href="#genero/${encodeURIComponent(genres[0])}">${genres[0].toLowerCase()}</a>` : 'Mismo género',
          generoNuevas.slice(0, 6),
          f => `${f.peli.director || ''}${f.peli.year ? ` · ${f.peli.year}` : ''}`,
          ''
        );
      }

      html += `</div></div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── LUGARES ── */
    function renderLugares() {
      const lugarStats = {};
      for (const f of DATA) for (const l of f.lugares) {
        if (!lugarStats[l]) lugarStats[l] = { findes: 0, pelis: 0 };
        lugarStats[l].findes += 1;
        lugarStats[l].pelis += f.personas.reduce((s, p) => s + p.peliculas.length, 0);
      }

      let html = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Lugares</h1>
        <div class="stagger">
      `;
      const sorted = Object.entries(lugarStats).sort((a, b) => b[1].findes - a[1].findes);
      for (const [i, [name, s]] of sorted.entries()) {
        html += `<a href="#lugar/${encodeURIComponent(name)}" class="archive-row" style="--i:${i}">
          <span class="ar-num ar-ico">${ico('lugar')}</span>
          <span class="ar-body">
            <span class="ar-date">${name}</span>
            <span class="ar-place">${s.findes} findes · ${s.pelis} películas</span>
          </span>
          <span class="ar-count">${s.findes} ${s.findes === 1 ? 'finde' : 'findes'}</span>
        </a>`;
      }
      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── LUGAR DETAIL ── */
    function renderLugar(nombre) {
      const findes = DATA.filter(f => f.lugares.includes(nombre));
      const totalPelis = findes.reduce((s, f) => s + f.personas.reduce((sp, p) => sp + p.peliculas.length, 0), 0);

      let html = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#lugares', label:'Lugares'}, {href:'#', label: nombre}])}

        <h1 class="page-heading">${nombre}</h1>
        <div class="page-sub">${findes.length} findes · ${totalPelis} películas</div>

        <div class="stagger">
      `;
      for (const [i, f] of findes.entries()) {
        const npelis = f.personas.reduce((s, p) => s + p.peliculas.length, 0);
        const participantes = f.personas.map(p =>
          `<a href="#persona/${encodeURIComponent(p.nombre)}" style="color:var(--tx-2)">${p.nombre}</a>`
        ).join(', ');
        html += `<a href="#finde/${f.numero}" class="archive-row" style="--i:${i}">
          <span class="ar-num">${f.numero}</span>
          <span class="ar-body">
            <span class="ar-date">${f.fecha || '—'}</span>
            <span class="ar-place ar-clip">${f.personas.map(p=>p.nombre).join(', ')}</span>
          </span>
          <span class="ar-count">${npelis} películas</span>
        </a>`;
      }
      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── DIRECTORES ── */
    function getDirectorStats() {
      const directors = {};
      for (const [slug, peli] of Object.entries(PELI_CACHE)) {
        if (!peli || !peli.director) continue;
        for (const d of peli.director.split(', ')) {
          if (!directors[d]) directors[d] = { films: [], findes: new Set(), poster: null };
          directors[d].films.push({ slug, peli });
          if (!directors[d].poster && peli.poster) directors[d].poster = peli.poster;
          if (peli.findes) peli.findes.forEach(n => directors[d].findes.add(n));
        }
      }
      return directors;
    }

    function renderDirectores() {
      const directors = getDirectorStats();
      const sorted = Object.entries(directors).sort((a, b) => b[1].films.length - a[1].films.length);

      let html = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Directores</h1>
        <div class="page-sub">${sorted.length} directores en el archivo</div>

        <div class="field filter-input" style="max-width:360px;margin-bottom:1.5rem">
          <div class="control">
            <input class="input" type="search" id="director-search" placeholder="Filtrar por nombre...">
          </div>
        </div>

        <div class="stagger" id="directors-list">
      `;
      for (const [i, [name, stats]] of sorted.entries()) {
        const topFilms = stats.films.slice(0, 3).map(f => {
          const t = f.peli.titulo_original || f.peli.titulo;
          const yr = f.peli.year ? ` (${f.peli.year})` : '';
          return t + yr;
        }).join(', ');
        const extra = stats.films.length > 3 ? `… y ${stats.films.length - 3} más` : '';
        html += `<a href="#director/${encodeURIComponent(name)}" class="archive-row" style="--i:${Math.min(i, 20)}">
          <span class="ar-num ar-ico">${ico('camara')}</span>
          <span class="ar-body">
            <span class="ar-date">${name}</span>
            <span class="ar-place ar-clip">${topFilms}${extra}</span>
          </span>
          <span class="ar-count">${stats.films.length} peli${stats.films.length !== 1 ? 's' : ''}</span>
        </a>`;
      }
      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;

      document.getElementById('director-search').addEventListener('input', function() {
        const q = normalize(this.value);
        for (const card of document.querySelectorAll('#directors-list .archive-row')) {
          card.style.display = normalize(card.textContent).includes(q) ? '' : 'none';
        }
      });
    }

    /* ── DIRECTOR DETAIL ── */
    function renderDirector(nombre) {
      const directors = getDirectorStats();
      const stats = directors[nombre];
      if (!stats) { notFound(`a ${nombre}`, '#directores', 'Ver todos los directores'); return; }

      const films = stats.films.sort((a, b) => {
        const ya = parseInt(a.peli.year) || 9999;
        const yb = parseInt(b.peli.year) || 9999;
        return ya - yb;
      });

      // Find which personas brought these films and in which findes
      const appearances = [];
      for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
        if (typeof m === 'string') continue;
        const peli = PELI_CACHE[m.slug];
        if (peli && peli.director && peli.director.split(', ').includes(nombre)) {
          appearances.push({ finde: f, persona: p.nombre, slug: m.slug, peli });
        }
      }

      let html = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#directores', label:'Directores'}, {href:'#', label: nombre}])}

        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem">
          <div class="persona-avatar avatar-dir" style="width:56px;height:56px;font-size:1.35rem">${ico('camara')}</div>
          <div>
            <h1 class="page-heading" style="margin-bottom:.1rem">${nombre}</h1>
            <div class="page-sub" style="margin-bottom:0">${films.length} película${films.length !== 1 ? 's' : ''} en el archivo</div>
          </div>
        </div>

        <h2 style="font-family:var(--ff-display);font-size:1.2rem;margin-bottom:.75rem">Filmografía</h2>
        <div class="columns is-multiline stagger">
      `;
      for (const [i, { slug, peli }] of films.entries()) {
        const orig = peli.titulo_original || peli.titulo;
        const es = peli.titulo_es || peli.titulo;
        const titleDisplay = orig.toLowerCase() === es.toLowerCase()
          ? orig : `${orig} <span class="peli-es">(${es})</span>`;
        const posterHtml = peli.poster
          ? `<img src="${posterUrl(peli.poster, POSTER.sm)}" alt="" loading="lazy" style="width:60px;height:90px;object-fit:cover;border-radius:4px">`
          : posterPh(orig, 'poster-ph-md');
        const rating = peli.tmdb_rating ? `<span style="color:var(--gold);font-size:.78rem">${ico('estrella','class="ico ico-estrella"')} ${fmtRating(peli.tmdb_rating)}</span>` : '';
        const genres = genreTags(peli) ? `<div class="mt-2">${genreTags(peli)}</div>` : '';

        html += `<div class="column is-half-tablet" style="--i:${i}">
          <a href="#pelicula/${slug}" style="text-decoration:none;color:inherit">
            <div class="card">
              <div class="card-content" style="display:flex;gap:.85rem;padding:1rem">
                ${posterHtml}
                <div style="flex:1;min-width:0">
                  <div style="font-weight:600;font-size:.92rem;margin-bottom:.2rem">${titleDisplay}</div>
                  <div style="font-size:.8rem;color:var(--tx-3)">${peli.year || '?'} · ${peli.runtime || ''}</div>
                  ${rating}
                  ${genres}
                </div>
              </div>
            </div>
          </a>
        </div>`;
      }
      html += `</div>`;

      // Appearances in Findes
      html += `<h2 style="font-family:var(--ff-display);font-size:1.2rem;margin-top:2rem;margin-bottom:.75rem">En los Findes</h2>`;
      html += `<div class="menu"><ul class="menu-list">`;
      const seen = new Set();
      for (const a of appearances) {
        const key = `${a.finde.numero}-${a.slug}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const orig = a.peli.titulo_original || a.peli.titulo;
        html += `<li><a href="#finde/${a.finde.numero}" style="display:flex;justify-content:space-between;align-items:center;gap:.5rem">
          <span><strong>${orig}</strong> — traída por <span style="color:var(--wine)">${a.persona}</span></span>
          <span style="color:var(--tx-3);font-size:.78rem;font-family:var(--ff-display);font-style:italic;flex-shrink:0">Finde #${a.finde.numero}</span>
        </a></li>`;
      }
      html += `</ul></div>`;

      html += `</div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── DÉCADAS (de películas) ── */
    function getMovieDecades() {
      const decades = {};
      for (const [slug, peli] of Object.entries(PELI_CACHE)) {
        if (!peli || !peli.year) continue;
        const yr = parseInt(peli.year);
        if (isNaN(yr)) continue;
        const dec = Math.floor(yr / 10) * 10;
        if (!decades[dec]) decades[dec] = [];
        decades[dec].push({ slug, peli });
      }
      return decades;
    }

    function renderDecadas() {
      const decades = getMovieDecades();
      const sorted = Object.keys(decades).map(Number).sort();

      let html = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Décadas</h1>
        <div class="page-sub">Películas del archivo agrupadas por la década en que fueron realizadas</div>

        <div class="columns is-multiline stagger">
      `;
      for (const [i, dec] of sorted.entries()) {
        const films = decades[dec];
        const topFilms = films
          .sort((a, b) => (b.peli.tmdb_rating || 0) - (a.peli.tmdb_rating || 0))
          .slice(0, 4);
        const posters = topFilms.filter(f => f.peli.poster).slice(0, 4);

        html += `<div class="column is-half-tablet is-one-third-desktop" style="--i:${i}">
          <a href="#decada/${dec}" style="text-decoration:none;color:inherit">
            <div class="card">
              <div class="card-content" style="padding:1.15rem">
                <div style="display:flex;gap:4px;margin-bottom:.75rem;height:80px;overflow:hidden;border-radius:4px">
                  ${posters.length ? posters.map(f =>
                    `<img src="${posterUrl(f.peli.poster, POSTER.xs)}" alt="" loading="lazy" style="height:80px;width:54px;object-fit:cover;border-radius:3px;flex-shrink:0">`
                  ).join('') : `<div style="height:80px;width:100%;background:var(--bg-inset);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--tx-3)">${ico('film')}</div>`}
                </div>
                <div style="font-family:var(--ff-display);font-size:1.6rem;color:var(--wine);line-height:1">${dec}s</div>
                <div style="font-size:.8rem;color:var(--tx-3);margin-top:.25rem">${films.length} película${films.length !== 1 ? 's' : ''}</div>
              </div>
            </div>
          </a>
        </div>`;
      }
      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    function renderDecada(dec) {
      const decades = getMovieDecades();
      const films = decades[dec];
      if (!films) { notFound(`la década de los ${dec}`, '#decadas', 'Ver todas las décadas'); return; }

      // Sort by year then title
      films.sort((a, b) => {
        const ya = parseInt(a.peli.year) || 0, yb = parseInt(b.peli.year) || 0;
        if (ya !== yb) return ya - yb;
        const ta = a.peli.titulo_original || a.peli.titulo;
        const tb = b.peli.titulo_original || b.peli.titulo;
        return ta.localeCompare(tb, 'es');
      });

      // Find who brought each film and in which finde
      function findAppearances(slug) {
        const apps = [];
        for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
          if (typeof m !== 'string' && m.slug === slug) apps.push({ persona: p.nombre, finde: f });
        }
        return apps;
      }

      // Group by year within the decade
      const years = {};
      for (const f of films) {
        const y = f.peli.year;
        if (!years[y]) years[y] = [];
        years[y].push(f);
      }

      let html = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#decadas', label:'Décadas'}, {href:'#', label: dec + 's'}])}

        <h1 class="page-heading">${dec}s</h1>
        <div class="page-sub">${films.length} película${films.length !== 1 ? 's' : ''} realizadas entre ${dec} y ${dec + 9}</div>

        <div id="decada-list">
      `;

      for (const year of Object.keys(years).sort()) {
        const yearFilms = years[year];
        html += `<div class="alpha-heading">${year} <span class="decade-count">${yearFilms.length}</span></div>`;

        for (const { slug, peli } of yearFilms) {
          const orig = peli.titulo_original || peli.titulo;
          const es = peli.titulo_es || peli.titulo;
          const titleDisplay = orig.toLowerCase() === es.toLowerCase()
            ? orig : `${orig} <span class="peli-es">(${es})</span>`;
          const posterHtml = peli.poster
            ? `<img class="film-poster-sm" src="${posterUrl(peli.poster, POSTER.xs)}" alt="" loading="lazy">`
            : posterPh(plainTitle(peli, slug), 'film-poster-ph');
          const apps = findAppearances(slug);
          const subParts = [];
          if (peli.director) subParts.push(peli.director);
          if (apps.length) subParts.push(apps.map(a =>
            `<a href="#persona/${encodeURIComponent(a.persona)}" style="color:var(--tx-3)">${a.persona}</a> · <a href="#finde/${a.finde.numero}" style="color:var(--tx-3)">#${a.finde.numero}</a>`
          ).join(' / '));

          html += `<div class="film-row">
            ${posterHtml}
            <div class="film-row-body">
              <div class="film-row-title"><a href="#pelicula/${slug}">${titleDisplay}</a></div>
              <div class="film-row-sub">${subParts.join(' — ')}</div>
            </div>
          </div>`;
        }
      }

      html += `</div></div></section>`;
      document.getElementById('view').innerHTML = html;
    }

    /* ── GÉNERO ── */
    function renderGenero(nombre) {
      const films = allFilmEntries().filter(f => genresOf(f.peli).includes(nombre));
      if (!films.length) { notFound(`el género "${nombre}"`, '#peliculas', 'Ver todas las películas'); return; }

      films.sort((a, b) => (parseFloat(b.peli.tmdb_rating) || 0) - (parseFloat(a.peli.tmdb_rating) || 0));

      // Géneros que más se repiten junto a este.
      const vecinos = {};
      for (const f of films) for (const g of genresOf(f.peli)) {
        if (g !== nombre) vecinos[g] = (vecinos[g] || 0) + 1;
      }
      const relacionados = Object.entries(vecinos).sort((a, b) => b[1] - a[1]).slice(0, 8);

      const conNota = films.filter(f => f.peli.tmdb_rating);
      const media = conNota.length
        ? conNota.reduce((s, f) => s + parseFloat(f.peli.tmdb_rating), 0) / conNota.length : null;

      document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
        ${breadcrumb([{href:'#', label:'Inicio'}, {href:'#peliculas', label:'Películas'}, {href:'#', label: nombre}])}
        <h1 class="page-heading">${nombre}</h1>
        <div class="page-sub">
          ${films.length} película${films.length !== 1 ? 's' : ''} en el archivo${media ? ` · nota media ${media.toFixed(1)}` : ''}
        </div>
        ${relacionados.length ? `<div class="chips mb-5">
          ${relacionados.map(([g, n]) =>
            `<a class="chip" href="#genero/${encodeURIComponent(g)}">${g}<span class="chip-n">${n}</span></a>`).join('')}
        </div>` : ''}
        <div class="poster-grid stagger">
          ${films.map((f, i) => posterTile(f.slug, f.peli,
            [f.peli.year, appearancesOf(f.slug).map(a => a.persona).join(' / ')].filter(Boolean).join(' · '),
            Math.min(i, 24))).join('')}
        </div>
      </div></section>`;
    }

    /* ── ESTADÍSTICAS ── */
    function renderEstadisticas() {
      const films = allFilmEntries();
      const conFicha = films.filter(f => f.peli);
      const conNota = conFicha.filter(f => f.peli.tmdb_rating);
      const conAnio = conFicha.filter(f => parseInt(f.peli.year));
      const minutos = conFicha.reduce((s, f) => s + (parseInt(f.peli.runtime) || 0), 0);
      const notaMedia = conNota.length
        ? conNota.reduce((s, f) => s + parseFloat(f.peli.tmdb_rating), 0) / conNota.length : 0;
      const anioMedio = conAnio.length
        ? conAnio.reduce((s, f) => s + parseInt(f.peli.year), 0) / conAnio.length : 0;

      const horas = Math.round(minutos / 60);
      const dias = (minutos / 60 / 24).toFixed(1);

      // ── Rankings
      const cuenta = (lista) => Object.entries(lista.reduce((acc, k) => (acc[k] = (acc[k] || 0) + 1, acc), {}))
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'es'));

      const generos = cuenta(conFicha.flatMap(f => genresOf(f.peli)));
      const directores = cuenta(conFicha.flatMap(f => f.peli.director ? f.peli.director.split(', ') : []));
      const decadas = cuenta(conAnio.map(f => `${Math.floor(parseInt(f.peli.year) / 10) * 10}s`))
        .sort((a, b) => a[0].localeCompare(b[0]));

      // ── Récords
      const maxBy = (arr, fn) => arr.reduce((best, f) => (!best || fn(f) > fn(best)) ? f : best, null);
      const minBy = (arr, fn) => arr.reduce((best, f) => (!best || fn(f) < fn(best)) ? f : best, null);
      const records = [
        ['Mejor valorada',  maxBy(conNota, f => parseFloat(f.peli.tmdb_rating)), f => `${ico('estrella','class="ico ico-estrella"')} ${fmtRating(f.peli.tmdb_rating)}`],
        ['Peor valorada',   minBy(conNota, f => parseFloat(f.peli.tmdb_rating)), f => `${ico('estrella','class="ico ico-estrella"')} ${fmtRating(f.peli.tmdb_rating)}`],
        ['La más antigua',  minBy(conAnio, f => parseInt(f.peli.year)),          f => f.peli.year],
        ['La más reciente', maxBy(conAnio, f => parseInt(f.peli.year)),          f => f.peli.year],
        ['La más larga',    maxBy(conFicha.filter(f => parseInt(f.peli.runtime)), f => parseInt(f.peli.runtime)), f => f.peli.runtime],
        ['La más corta',    minBy(conFicha.filter(f => parseInt(f.peli.runtime)), f => parseInt(f.peli.runtime)), f => f.peli.runtime],
      ].filter(r => r[1]);

      // ── Perfil por persona
      const personas = [...new Set(DATA.flatMap(f => f.personas.map(p => p.nombre)))];
      const perfiles = personas.map(nombre => {
        const slugs = [];
        for (const f of DATA) for (const p of f.personas) {
          if (p.nombre !== nombre) continue;
          for (const m of p.peliculas) if (typeof m !== 'string' && m.slug) slugs.push(m.slug);
        }
        const fichas = slugs.map(s => PELI_CACHE[s]).filter(Boolean);
        const notas = fichas.map(p => parseFloat(p.tmdb_rating)).filter(n => !isNaN(n));
        const anios = fichas.map(p => parseInt(p.year)).filter(n => !isNaN(n));
        const gs = cuenta(fichas.flatMap(p => genresOf(p)));
        return {
          nombre,
          total: slugs.length,
          findes: DATA.filter(f => f.personas.some(p => p.nombre === nombre)).length,
          nota: notas.length ? notas.reduce((a, b) => a + b, 0) / notas.length : null,
          anio: anios.length ? Math.round(anios.reduce((a, b) => a + b, 0) / anios.length) : null,
          genero: gs.length ? gs[0][0] : null
        };
      }).sort((a, b) => b.total - a.total);

      const bars = (items, max, clase, hrefFn) => `<div class="bars">
        ${items.map(([label, n], i) => `<div class="bar-row">
          ${hrefFn ? `<a class="bar-label" href="${hrefFn(label)}">${label}</a>` : `<span class="bar-label">${label}</span>`}
          <span class="bar-track"><span class="bar-fill ${clase || ''}" style="width:${(n / max * 100).toFixed(1)}%;--i:${i}"></span></span>
          <span class="bar-value">${n}</span>
        </div>`).join('')}
      </div>`;

      const topGeneros = generos.slice(0, 10);
      const topDirectores = directores.filter(([, n]) => n > 1).slice(0, 12);

      document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
        <h1 class="page-heading">Las cifras</h1>
        <div class="page-sub">Lo que ${DATA.length} findes de cine dejan en números.</div>

        <div class="stat-cards">
          <div class="stat-card"><div class="k">${films.length}</div><div class="l">Películas</div></div>
          <div class="stat-card"><div class="k">${horas}</div><div class="l">Horas de cine</div></div>
          <div class="stat-card"><div class="k">${dias}</div><div class="l">Días seguidos</div></div>
          <div class="stat-card"><div class="k">${notaMedia.toFixed(1)}</div><div class="l">Nota media</div></div>
          <div class="stat-card"><div class="k">${Math.round(anioMedio)}</div><div class="l">Año medio</div></div>
          <div class="stat-card"><div class="k">${directores.length}</div><div class="l">Directores</div></div>
        </div>

        <h2 class="section-title">Récords del archivo</h2>
        <div class="section-note">Según las notas de TMDB, con todo el respeto.</div>
        <div class="record-list">
          ${records.map(([kind, f, valFn]) => {
            const url = posterUrl(f.peli.poster, POSTER.xs);
            return `<a class="record" href="#pelicula/${f.slug}">
              ${url ? `<img src="${url}" alt="" loading="lazy">` : posterPh(plainTitle(f.peli, f.titulo), 'ph')}
              <div class="record-body">
                <div class="record-kind">${kind}</div>
                <div class="record-title">${plainTitle(f.peli, f.titulo)}</div>
                <div class="record-meta">${[f.peli.year, f.peli.director].filter(Boolean).join(' · ')}</div>
              </div>
              <span class="record-num">${valFn(f)}</span>
            </a>`;
          }).join('')}
        </div>

        <h2 class="section-title">Por década de rodaje</h2>
        <div class="section-note">En qué época se hicieron las películas que veis.</div>
        ${bars(decadas, Math.max(...decadas.map(d => d[1])), '', l => `#decada/${parseInt(l)}`)}

        <h2 class="section-title">Géneros favoritos</h2>
        <div class="section-note">Una película cuenta en todos sus géneros.</div>
        ${bars(topGeneros, topGeneros[0] ? topGeneros[0][1] : 1, 'alt', l => `#genero/${encodeURIComponent(l)}`)}

        ${topDirectores.length ? `<h2 class="section-title">Directores recurrentes</h2>
        <div class="section-note">Los que han aparecido más de una vez.</div>
        ${bars(topDirectores, topDirectores[0][1], 'alt2', l => `#director/${encodeURIComponent(l)}`)}` : ''}

        <h2 class="section-title">Quién trae qué</h2>
        <div class="section-note">El perfil de cada uno, según lo que ha puesto sobre la mesa.</div>
        <div class="profile-grid">
          ${perfiles.map(p => `<div class="profile-item">
            <div class="pl">${p.findes} findes · ${p.total} pelis</div>
            <div class="pv"><a href="#persona/${encodeURIComponent(p.nombre)}">${p.nombre}</a></div>
            <div class="ps">
              ${p.nota ? `nota ${p.nota.toFixed(1)}` : 'sin notas'}
              ${p.anio ? ` · año medio ${p.anio}` : ''}
            </div>
            ${p.genero ? `<div class="ps">le va el ${p.genero.toLowerCase()}</div>` : ''}
          </div>`).join('')}
        </div>
      </div></section>`;
    }

    /* ── QUIZ ── */
    let QUIZ_DATA = null;

    /* ═══ Quiz Precríticos ═══
       Las preguntas no están escritas a mano: se generan del propio archivo,
       así que nunca se repiten dos rondas iguales y siempre están al día. */

    const azar = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const barajar = (arr) => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
    // n elementos distintos, sin repetir.
    const muestra = (arr, n) => barajar(arr).slice(0, n);

    // En el quiz manda el título en castellano: es por el que las conocéis,
    // y evita preguntas imposibles del tipo «Krótki film o zabijaniu».
    function tituloCorto(peli, fallback) {
      const t = (peli && (peli.titulo_es || peli.titulo)) || fallback || '';
      return t.length > 60 ? t.slice(0, 57) + '…' : t;
    }

    // Contexto precalculado: una vez por ronda, no por pregunta.
    function contextoQuiz() {
      const findes = DATA.filter(f => f.personas.length);
      const personas = [...new Set(DATA.flatMap(f => f.personas.map(p => p.nombre)))];
      const lugares = [...new Set(DATA.flatMap(f => f.lugares))];
      const pelis = [];
      for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
        if (typeof m === 'string' || !m.slug) continue;
        const ficha = PELI_CACHE[m.slug];
        pelis.push({ slug: m.slug, titulo: m.titulo, peli: ficha, persona: p.nombre, finde: f });
      }
      // Una entrada por película, guardando todas sus apariciones.
      const porSlug = new Map();
      for (const e of pelis) {
        if (!porSlug.has(e.slug)) porSlug.set(e.slug, { ...e, apariciones: [] });
        porSlug.get(e.slug).apariciones.push({ persona: e.persona, finde: e.finde });
      }
      const unicas = [...porSlug.values()];
      return {
        findes, personas, lugares, pelis, unicas,
        conFicha: unicas.filter(e => e.peli),
        conPoster: unicas.filter(e => e.peli && e.peli.poster),
        conAnio: unicas.filter(e => e.peli && parseInt(e.peli.year)),
        conDirector: unicas.filter(e => e.peli && e.peli.director),
        conNota: unicas.filter(e => e.peli && parseFloat(e.peli.tmdb_rating)),
        directores: [...new Set(unicas.flatMap(e => e.peli && e.peli.director ? e.peli.director.split(', ') : []))],
        unaSolaVez: unicas.filter(e => e.apariciones.length === 1)
      };
    }

    // Cada generador devuelve una pregunta o null si no hay datos suficientes.
    const GENERADORES = [
      // ── Quién trajo qué
      function quienTrajo(c) {
        const e = azar(c.unaSolaVez);
        if (!e || c.personas.length < 4) return null;
        const correcta = e.apariciones[0].persona;
        const otras = muestra(c.personas.filter(n => n !== correcta), 3);
        if (otras.length < 3) return null;
        return {
          clave: `quien-${e.slug}`,
          tipo: 'Quién la trajo',
          pregunta: `¿Quién trajo <em>${tituloCorto(e.peli, e.titulo)}</em> al Finde #${e.apariciones[0].finde.numero}?`,
          poster: e.peli && e.peli.poster,
          opciones: [correcta, ...otras],
          correcta,
          explicacion: `La trajo <strong>${correcta}</strong> al Finde #${e.apariciones[0].finde.numero} (${e.apariciones[0].finde.fecha}).`,
          href: `#pelicula/${e.slug}`
        };
      },

      // ── En qué finde se vio
      function enQueFinde(c) {
        const e = azar(c.unaSolaVez);
        if (!e || c.findes.length < 4) return null;
        const bueno = e.apariciones[0].finde;
        const otros = muestra(c.findes.filter(f => f.numero !== bueno.numero), 3);
        if (otros.length < 3) return null;
        const etiqueta = f => `Finde #${f.numero} · ${f.fecha || '—'}`;
        return {
          clave: `finde-${e.slug}`,
          tipo: 'En qué finde',
          pregunta: `¿En qué finde se vio <em>${tituloCorto(e.peli, e.titulo)}</em>?`,
          poster: e.peli && e.peli.poster,
          opciones: [etiqueta(bueno), ...otros.map(etiqueta)],
          correcta: etiqueta(bueno),
          explicacion: `Se vio en el Finde #${bueno.numero}, en ${bueno.lugares.join(' y ')}. La trajo ${e.apariciones[0].persona}.`,
          href: `#finde/${bueno.numero}`
        };
      },

      // ── Dónde se celebró
      function lugarDelFinde(c) {
        const f = azar(c.findes);
        if (!f || c.lugares.length < 4) return null;
        const bueno = f.lugares[0];
        const otros = muestra(c.lugares.filter(l => !f.lugares.includes(l)), 3);
        if (otros.length < 3) return null;
        return {
          clave: `lugar-${f.numero}`,
          tipo: 'Dónde fue',
          pregunta: `¿Dónde se celebró el Finde #${f.numero}${f.fecha ? ` (${f.fecha})` : ''}?`,
          poster: null,
          opciones: [bueno, ...otros],
          correcta: bueno,
          explicacion: `El Finde #${f.numero} fue en <strong>${f.lugares.join(' y ')}</strong>, con ${f.personas.length} participantes.`,
          href: `#finde/${f.numero}`
        };
      },

      // ── Qué trajo fulano a tal finde
      function queTrajoAlFinde(c) {
        const f = azar(c.findes.filter(x => x.personas.length >= 2));
        if (!f) return null;
        const p = azar(f.personas.filter(x => x.peliculas.some(m => typeof m !== 'string' && m.slug)));
        if (!p) return null;
        const suya = azar(p.peliculas.filter(m => typeof m !== 'string' && m.slug));
        const ajenas = f.personas
          .filter(x => x.nombre !== p.nombre)
          .flatMap(x => x.peliculas)
          .filter(m => typeof m !== 'string' && m.slug);
        const otras = muestra(ajenas, 3);
        if (otras.length < 3) return null;
        const et = m => tituloCorto(PELI_CACHE[m.slug], m.titulo);
        return {
          clave: `trajo-${f.numero}-${p.nombre}-${suya.slug}`,
          tipo: 'Quién trajo qué',
          pregunta: `De estas cuatro del Finde #${f.numero}, ¿cuál trajo <strong>${p.nombre}</strong>?`,
          poster: null,
          opciones: [et(suya), ...otras.map(et)],
          correcta: et(suya),
          explicacion: `${p.nombre} trajo <em>${et(suya)}</em>. Las otras tres también se vieron ese finde, pero las trajeron otros.`,
          href: `#finde/${f.numero}`
        };
      },

      // ── Cuál NO se vio ahí
      function cualNoSeVio(c) {
        const f = azar(c.findes);
        if (!f) return null;
        const dentro = f.personas.flatMap(p => p.peliculas).filter(m => typeof m !== 'string' && m.slug);
        if (dentro.length < 3) return null;
        const slugsDentro = new Set(dentro.map(m => m.slug));
        const fuera = azar(c.unicas.filter(e => !slugsDentro.has(e.slug)));
        if (!fuera) return null;
        const tres = muestra(dentro, 3);
        const et = m => tituloCorto(PELI_CACHE[m.slug], m.titulo);
        const intrusa = tituloCorto(fuera.peli, fuera.titulo);
        return {
          clave: `nose-${f.numero}-${fuera.slug}`,
          tipo: 'La intrusa',
          pregunta: `¿Cuál de estas <strong>no</strong> se vio en el Finde #${f.numero}?`,
          poster: null,
          opciones: [intrusa, ...tres.map(et)],
          correcta: intrusa,
          explicacion: `<em>${intrusa}</em> se vio en el Finde #${fuera.apariciones[0].finde.numero}, no en el #${f.numero}.`,
          href: `#finde/${f.numero}`
        };
      },

      // ── Quién dirigió
      function quienDirigio(c) {
        const e = azar(c.conDirector);
        if (!e || c.directores.length < 4) return null;
        const bueno = e.peli.director.split(', ')[0];
        const otros = muestra(c.directores.filter(d => !e.peli.director.includes(d)), 3);
        if (otros.length < 3) return null;
        return {
          clave: `dir-${e.slug}`,
          tipo: 'Quién dirigió',
          pregunta: `¿Quién dirigió <em>${tituloCorto(e.peli, e.titulo)}</em> (${e.peli.year || '?'})?`,
          poster: e.peli.poster,
          opciones: [bueno, ...otros],
          correcta: bueno,
          explicacion: `La dirigió <strong>${e.peli.director}</strong>. La trajo ${e.apariciones[0].persona} al Finde #${e.apariciones[0].finde.numero}.`,
          href: `#director/${encodeURIComponent(bueno)}`
        };
      },

      // ── Reconocer el cartel
      function queCartel(c) {
        const e = azar(c.conPoster);
        if (!e) return null;
        const otras = muestra(c.unicas.filter(x => x.slug !== e.slug), 3);
        if (otras.length < 3) return null;
        return {
          clave: `cartel-${e.slug}`,
          tipo: 'El cartel',
          pregunta: `¿De qué película es este cartel?`,
          poster: e.peli.poster,
          opciones: [tituloCorto(e.peli, e.titulo), ...otras.map(x => tituloCorto(x.peli, x.titulo))],
          correcta: tituloCorto(e.peli, e.titulo),
          explicacion: `Es <em>${tituloCorto(e.peli, e.titulo)}</em>${e.peli.year ? ` (${e.peli.year})` : ''}${e.peli.director ? `, de ${e.peli.director}` : ''}.`,
          href: `#pelicula/${e.slug}`
        };
      },

      // ── La más antigua de cuatro
      function laMasAntigua(c) {
        const cuatro = muestra(c.conAnio, 4);
        if (cuatro.length < 4) return null;
        const anios = cuatro.map(e => parseInt(e.peli.year));
        if (new Set(anios).size < 4) return null;
        const vieja = cuatro.reduce((a, b) => parseInt(a.peli.year) < parseInt(b.peli.year) ? a : b);
        return {
          clave: `vieja-${cuatro.map(e => e.slug).sort().join('|')}`,
          tipo: 'La más antigua',
          pregunta: '¿Cuál de estas cuatro es la más antigua?',
          poster: null,
          opciones: cuatro.map(e => tituloCorto(e.peli, e.titulo)),
          correcta: tituloCorto(vieja.peli, vieja.titulo),
          explicacion: cuatro
            .slice()
            .sort((a, b) => parseInt(a.peli.year) - parseInt(b.peli.year))
            .map(e => `${e.peli.year} · ${tituloCorto(e.peli, e.titulo)}`)
            .join('<br>'),
          href: `#pelicula/${vieja.slug}`
        };
      },

      // ── La mejor valorada de cuatro
      function laMejorNota(c) {
        const cuatro = muestra(c.conNota, 4);
        if (cuatro.length < 4) return null;
        const notas = cuatro.map(e => parseFloat(e.peli.tmdb_rating));
        if (new Set(notas).size < 4) return null;
        const mejor = cuatro.reduce((a, b) => parseFloat(a.peli.tmdb_rating) > parseFloat(b.peli.tmdb_rating) ? a : b);
        return {
          clave: `nota-${cuatro.map(e => e.slug).sort().join('|')}`,
          tipo: 'La mejor valorada',
          pregunta: '¿Cuál tiene mejor nota en TMDB?',
          poster: null,
          opciones: cuatro.map(e => tituloCorto(e.peli, e.titulo)),
          correcta: tituloCorto(mejor.peli, mejor.titulo),
          explicacion: cuatro
            .slice()
            .sort((a, b) => parseFloat(b.peli.tmdb_rating) - parseFloat(a.peli.tmdb_rating))
            .map(e => `${ico('estrella','class="ico ico-estrella"')} ${fmtRating(e.peli.tmdb_rating)} · ${tituloCorto(e.peli, e.titulo)}`)
            .join('<br>'),
          href: `#pelicula/${mejor.slug}`
        };
      },

      // ── En qué año fue aquel finde
      function anioDelFinde(c) {
        const f = azar(c.findes.filter(x => (x.fecha_sort || '').slice(0, 4).match(/^\d{4}$/)));
        if (!f) return null;
        const bueno = f.fecha_sort.slice(0, 4);
        const posibles = [...new Set(c.findes.map(x => (x.fecha_sort || '').slice(0, 4)))].filter(a => a && a !== bueno);
        const otros = muestra(posibles, 3);
        if (otros.length < 3) return null;
        return {
          clave: `anio-finde-${f.numero}`,
          tipo: 'La fecha',
          pregunta: `¿En qué año se celebró el Finde #${f.numero}, el de ${f.lugares.join(' y ')}?`,
          poster: null,
          opciones: [bueno, ...otros],
          correcta: bueno,
          explicacion: `Fue en ${f.fecha}, con ${f.personas.length} participantes y ${f.personas.reduce((s, p) => s + p.peliculas.length, 0)} películas.`,
          href: `#finde/${f.numero}`
        };
      },

      // ── De qué año es la película
      function anioDePeli(c) {
        const e = azar(c.conAnio);
        if (!e) return null;
        const bueno = e.peli.year;
        const base = parseInt(bueno);
        const candidatos = [];
        for (let d = -12; d <= 12; d++) {
          const a = String(base + d);
          if (d !== 0 && base + d > 1895 && base + d <= 2026) candidatos.push(a);
        }
        const otros = muestra(candidatos, 3);
        if (otros.length < 3) return null;
        return {
          clave: `anio-peli-${e.slug}`,
          tipo: 'El año',
          pregunta: `¿De qué año es <em>${tituloCorto(e.peli, e.titulo)}</em>?`,
          poster: e.peli.poster,
          opciones: [bueno, ...otros],
          correcta: bueno,
          explicacion: `Es de ${bueno}${e.peli.director ? `, de ${e.peli.director}` : ''}. La trajo ${e.apariciones[0].persona} al Finde #${e.apariciones[0].finde.numero}.`,
          href: `#pelicula/${e.slug}`
        };
      },

      // ── Quién trae más de un género
      function generoDePersona(c) {
        const p = azar(c.personas);
        const suyas = c.unicas.filter(e => e.apariciones.some(a => a.persona === p) && e.peli);
        if (suyas.length < 5) return null;
        const cuenta = {};
        for (const e of suyas) for (const g of genresOf(e.peli)) cuenta[g] = (cuenta[g] || 0) + 1;
        const orden = Object.entries(cuenta).sort((a, b) => b[1] - a[1]);
        if (orden.length < 4 || orden[0][1] === orden[1][1]) return null;
        const bueno = orden[0][0];
        const otros = orden.slice(1).map(x => x[0]);
        return {
          clave: `genero-${p}`,
          tipo: 'Perfil',
          pregunta: `¿Cuál es el género que más ha traído <strong>${p}</strong>?`,
          poster: null,
          opciones: [bueno, ...muestra(otros, 3)],
          correcta: bueno,
          explicacion: `${p} ha traído ${orden[0][1]} películas de ${bueno.toLowerCase()}, de ${suyas.length} en total.`,
          href: `#persona/${encodeURIComponent(p)}`
        };
      },

      // ── Quién ha traído más
      function quienMasPelis(c) {
        const cuenta = {};
        for (const e of c.pelis) cuenta[e.persona] = (cuenta[e.persona] || 0) + 1;
        const orden = Object.entries(cuenta).sort((a, b) => b[1] - a[1]);
        if (orden.length < 4 || orden[0][1] === orden[1][1]) return null;
        return {
          clave: 'quien-mas',
          tipo: 'Récords',
          pregunta: '¿Quién ha traído más películas en toda la historia de los findes?',
          poster: null,
          opciones: [orden[0][0], ...orden.slice(1, 4).map(x => x[0])],
          correcta: orden[0][0],
          explicacion: orden.slice(0, 4).map(([n, v]) => `${n}: ${v} películas`).join('<br>'),
          href: `#persona/${encodeURIComponent(orden[0][0])}`
        };
      },

      // ── Dónde se han hecho más findes
      function lugarMasFindes(c) {
        const cuenta = {};
        for (const f of DATA) for (const l of f.lugares) cuenta[l] = (cuenta[l] || 0) + 1;
        const orden = Object.entries(cuenta).sort((a, b) => b[1] - a[1]);
        if (orden.length < 4 || orden[0][1] === orden[1][1]) return null;
        return {
          clave: 'lugar-mas',
          tipo: 'Récords',
          pregunta: '¿En qué lugar se han celebrado más findes?',
          poster: null,
          opciones: [orden[0][0], ...orden.slice(1, 4).map(x => x[0])],
          correcta: orden[0][0],
          explicacion: orden.slice(0, 4).map(([n, v]) => `${n}: ${v} findes`).join('<br>'),
          href: `#lugar/${encodeURIComponent(orden[0][0])}`
        };
      }
    ];

    function generarPreguntas(n) {
      const c = contextoQuiz();
      const preguntas = [];
      const vistas = new Set();
      const porTipo = {};
      // Máximo dos preguntas del mismo tipo por ronda, para que no salgan
      // cuatro carteles seguidos. Se relaja al final si no hay variedad.
      const tope = (intento) => intento < n * 20 ? 2 : n;
      // Intentos acotados: algunos generadores fallan si faltan datos.
      for (let i = 0; i < n * 40 && preguntas.length < n; i++) {
        const q = azar(GENERADORES)(c);
        if (!q || vistas.has(q.clave)) continue;
        if ((porTipo[q.tipo] || 0) >= tope(i)) continue;
        // Opciones repetidas harían la pregunta ambigua.
        if (new Set(q.opciones).size !== q.opciones.length) continue;
        vistas.add(q.clave);
        porTipo[q.tipo] = (porTipo[q.tipo] || 0) + 1;
        q.opciones = barajar(q.opciones);
        preguntas.push(q);
      }
      return preguntas;
    }

    function renderQuizPrecriticos() {
      const preguntas = generarPreguntas(10);
      if (!preguntas.length) {
        document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
          ${quizCabecera('precriticos')}
          <div class="empty-state"><div class="empty-icon">${ico('film')}</div>
          <div class="empty-title">No hay datos suficientes</div></div>
        </div></section>`;
        return;
      }

      let actual = 0, aciertos = 0;
      const fallos = [];

      document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
        ${quizCabecera('precriticos')}
        <div class="quiz-arena" style="min-height:auto">
          <div class="quiz-progress"><span id="quiz-counter">1 / ${preguntas.length}</span></div>
          <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-bar" style="width:0%"></div></div>
          <div class="quizp" id="quizp"></div>
        </div>
      </div></section>`;
      engancharModos();

      const pintar = () => {
        const q = preguntas[actual];
        document.getElementById('quiz-counter').textContent = `${actual + 1} / ${preguntas.length}`;
        document.getElementById('quiz-bar').style.width = `${(actual / preguntas.length) * 100}%`;
        document.getElementById('quizp').innerHTML = `
          <div class="quizp-card">
            <div class="quizp-kind">${q.tipo}</div>
            ${q.poster ? `<img class="quizp-poster" src="${posterUrl(q.poster, POSTER.md)}" alt="">` : ''}
            <div class="quizp-question">${q.pregunta}</div>
            <div class="quizp-options" id="quizp-options">
              ${q.opciones.map((o, i) => `<button class="quizp-option" data-op="${i}">
                <span class="letra">${'ABCD'[i]}</span><span>${o}</span>
              </button>`).join('')}
            </div>
            <div id="quizp-tras"></div>
          </div>`;

        document.querySelectorAll('#quizp-options .quizp-option').forEach(btn => {
          btn.addEventListener('click', () => responder(q, parseInt(btn.dataset.op)));
        });
      };

      const responder = (q, elegida) => {
        const botones = [...document.querySelectorAll('#quizp-options .quizp-option')];
        const idxCorrecta = q.opciones.indexOf(q.correcta);
        const acertada = elegida === idxCorrecta;
        if (acertada) aciertos++; else fallos.push(q);

        botones.forEach((b, i) => {
          b.disabled = true;
          if (i === idxCorrecta) b.classList.add('is-correct');
          else if (i === elegida) b.classList.add('is-wrong');
          else b.classList.add('is-dim');
        });

        const ultima = actual === preguntas.length - 1;
        document.getElementById('quizp-tras').innerHTML = `
          <div class="quizp-feedback">
            <strong>${ico(acertada ? 'si' : 'no')} ${acertada ? 'Correcto' : 'Casi'}</strong> — ${q.explicacion}
            <div style="margin-top:.4rem"><a href="${q.href}">Ver ficha →</a></div>
          </div>
          <button class="quizp-next" id="quizp-next">${ultima ? 'Ver resultado' : 'Siguiente →'}</button>`;

        document.getElementById('quizp-next').addEventListener('click', () => {
          if (ultima) resultado();
          else { actual++; pintar(); }
        });
      };

      const resultado = () => {
        const pct = Math.round((aciertos / preguntas.length) * 100);
        const circ = 2 * Math.PI * 58;
        let emoji, msg;
        if (pct === 100) { emoji = ico('trofeo'); msg = 'Pleno. Te sabes el archivo de memoria.'; }
        else if (pct >= 70) { emoji = ico('film'); msg = 'Muy bien: has estado atento todos estos años.'; }
        else if (pct >= 40) { emoji = ico('film'); msg = 'Aprobado raspado. Toca repasar findes.'; }
        else { emoji = ico('dormido'); msg = '¿Seguro que no te dormías en las proyecciones?'; }

        document.getElementById('quiz-counter').textContent = `${preguntas.length} / ${preguntas.length}`;
        document.getElementById('quiz-bar').style.width = '100%';
        document.getElementById('quizp').innerHTML = `
          <div class="quiz-results" style="max-width:none;margin:0 auto">
            <div class="result-ico">${emoji}</div>
            <div class="quiz-score-ring">
              <svg width="140" height="140" viewBox="0 0 140 140">
                <circle class="ring-bg" cx="70" cy="70" r="58" fill="none" stroke-width="8" />
                <circle class="ring-fg" cx="70" cy="70" r="58" fill="none" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" />
              </svg>
              <div class="quiz-score-text">
                <div class="quiz-score-num">${aciertos}/${preguntas.length}</div>
                <div class="quiz-score-label">aciertos</div>
              </div>
            </div>
            <div style="font-family:var(--ff-display);font-size:1.1rem;margin-bottom:1rem">${msg}</div>
            <button class="quizp-next" id="quizp-otra" style="max-width:260px;margin:0 auto">${ico('bobina')}&ensp;Otra ronda</button>
            ${fallos.length ? `<div class="quizp-review">
              <h2 class="section-title" style="margin-top:1.5rem">Lo que se te escapó</h2>
              ${fallos.map(q => `<div class="quizp-review-item">
                <div class="quizp-review-q">${q.pregunta}</div>
                <div class="quizp-review-a">${q.correcta}</div>
              </div>`).join('')}
            </div>` : ''}
          </div>`;

        requestAnimationFrame(() => requestAnimationFrame(() => {
          const anillo = document.querySelector('.ring-fg');
          if (anillo) anillo.style.strokeDashoffset = circ - (pct / 100) * circ;
        }));
        document.getElementById('quizp-otra').addEventListener('click', renderQuizPrecriticos);
      };

      pintar();
    }

    /* ── Selector de modo ── */
    function quizModo() {
      return localStorage.getItem('fp-quiz-modo') === 'cine' ? 'cine' : 'precriticos';
    }

    function quizCabecera(modo) {
      return `<h1 class="page-heading" style="text-align:center">Quiz</h1>
        <div class="quiz-modes">
          <div class="segmented" id="quiz-modes">
            <button data-modo="precriticos" class="${modo === 'precriticos' ? 'is-active' : ''}">Precríticos</button>
            <button data-modo="cine" class="${modo === 'cine' ? 'is-active' : ''}">Cine general</button>
          </div>
        </div>`;
    }

    function engancharModos() {
      document.querySelectorAll('#quiz-modes button').forEach(b => {
        b.addEventListener('click', () => {
          if (b.dataset.modo === quizModo()) return;
          localStorage.setItem('fp-quiz-modo', b.dataset.modo);
          renderQuiz();
        });
      });
    }

    function renderQuiz() {
      if (quizModo() === 'cine') renderQuizCine();
      else renderQuizPrecriticos();
    }

    async function loadQuiz() {
      if (QUIZ_DATA) return QUIZ_DATA;
      try {
        const res = await fetch('quiz.json');
        if (res.ok) QUIZ_DATA = await res.json();
      } catch(e) {}
      return QUIZ_DATA || [];
    }

    async function renderQuizCine() {
      const questions = await loadQuiz();
      if (!questions.length) {
        document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
          ${quizCabecera('cine')}
          <p style="color:var(--tx-2);text-align:center">No se pudieron cargar las preguntas.</p>
        </div></section>`;
        return;
      }

      // Shuffle questions
      const shuffled = [...questions].sort(() => Math.random() - 0.5);
      let current = 0;
      let score = 0;
      let answered = false;

      function renderShell() {
        document.getElementById('view').innerHTML = `<section class="main-section"><div class="container">
          ${quizCabecera('cine')}
          <div class="quiz-arena">
            <div class="quiz-progress">
              <span id="quiz-counter">1 / ${shuffled.length}</span>
            </div>
            <div class="quiz-progress-bar">
              <div class="quiz-progress-fill" id="quiz-bar" style="width:0%"></div>
            </div>
            <div class="quiz-card-wrapper" id="quiz-card-wrapper"></div>
            <div class="quiz-buttons">
              <button class="quiz-btn btn-no" id="btn-no" title="No">${ico('no')}</button>
              <button class="quiz-btn btn-yes" id="btn-yes" title="Sí">${ico('si')}</button>
            </div>
            <div style="margin-top:1rem">
              <div class="quiz-swipe-hint">← NO &nbsp;·&nbsp; SÍ →</div>
            </div>
          </div>
        </div></section>`;
        engancharModos();
      }

      function showCard() {
        answered = false;
        const q = shuffled[current];
        const peli = q.pelicula_slug ? PELI_CACHE[q.pelicula_slug] : null;
        const wrapper = document.getElementById('quiz-card-wrapper');
        document.getElementById('quiz-counter').textContent = `${current + 1} / ${shuffled.length}`;
        document.getElementById('quiz-bar').style.width = `${(current / shuffled.length) * 100}%`;

        const posterHtml = peli && peli.poster
          ? `<img class="quiz-card-poster" src="${posterUrl(peli.poster, POSTER.md)}" alt="" draggable="false">`
          : `<div class="quiz-card-poster-ph">${ico('film')}</div>`;

        wrapper.innerHTML = `
          <div class="quiz-card" id="quiz-active-card">
            <div class="quiz-overlay yes-label" id="overlay-yes">SÍ</div>
            <div class="quiz-overlay no-label" id="overlay-no">NO</div>
            ${posterHtml}
            <div class="quiz-card-question">${q.pregunta}</div>
          </div>
          <div class="quiz-feedback" id="quiz-feedback">
            <div class="quiz-feedback-icon" id="fb-icon"></div>
            <div class="quiz-feedback-text" id="fb-text"></div>
            <div class="quiz-feedback-explain" id="fb-explain"></div>
          </div>
        `;

        setupSwipe(document.getElementById('quiz-active-card'));
      }

      function answer(userSaidYes) {
        if (answered) return;
        answered = true;
        const q = shuffled[current];
        const correct = (userSaidYes === q.respuesta);
        if (correct) score++;

        const card = document.getElementById('quiz-active-card');
        card.classList.add(userSaidYes ? 'exit-right' : 'exit-left');

        // Show feedback after card exits
        setTimeout(() => {
          const fb = document.getElementById('quiz-feedback');
          document.getElementById('fb-icon').innerHTML = ico(correct ? 'si' : 'no');
          document.getElementById('fb-text').textContent = correct ? '¡Correcto!' : 'Incorrecto';
          document.getElementById('fb-explain').textContent = q.explicacion;
          fb.classList.add('visible');

          // Auto-advance
          setTimeout(() => {
            current++;
            if (current < shuffled.length) {
              showCard();
            } else {
              showResults();
            }
          }, 2000);
        }, 350);
      }

      function showResults() {
        const pct = Math.round((score / shuffled.length) * 100);
        const circ = 2 * Math.PI * 58;
        const offset = circ - (pct / 100) * circ;

        let emoji, msg;
        if (pct === 100) { emoji = ico('trofeo'); msg = '¡Perfecto! Eres un auténtico cinéfilo precrítico.'; }
        else if (pct >= 75) { emoji = ico('film'); msg = '¡Muy bien! Dominas el archivo.'; }
        else if (pct >= 50) { emoji = ico('film'); msg = 'No está mal, pero hay margen de mejora.'; }
        else { emoji = ico('camara'); msg = 'Necesitas más findes precríticos...'; }

        const wrapper = document.getElementById('quiz-card-wrapper');
        wrapper.style.height = 'auto';
        wrapper.innerHTML = `
          <div class="quiz-results">
            <div class="result-ico">${emoji}</div>
            <div class="quiz-score-ring">
              <svg width="140" height="140" viewBox="0 0 140 140">
                <circle class="ring-bg" cx="70" cy="70" r="58" fill="none" stroke-width="8" />
                <circle class="ring-fg" cx="70" cy="70" r="58" fill="none" stroke-width="8"
                  stroke-linecap="round"
                  stroke-dasharray="${circ}"
                  stroke-dashoffset="${circ}" />
              </svg>
              <div class="quiz-score-text">
                <div class="quiz-score-num">${score}/${shuffled.length}</div>
                <div class="quiz-score-label">aciertos</div>
              </div>
            </div>
            <div style="font-family:var(--ff-display);font-size:1.1rem;color:var(--tx);margin-bottom:.5rem">${msg}</div>
            <div style="display:flex;gap:.75rem;justify-content:center;margin-top:1rem">
              <button class="quiz-btn btn-yes" id="quiz-retry" title="Reintentar" style="width:auto;border-radius:8px;padding:.6rem 1.2rem;font-size:.88rem;font-weight:600;font-family:var(--ff-body)">
                ${ico('bobina')}&ensp;Reintentar
              </button>
              <a href="#" class="quiz-btn btn-no" style="width:auto;border-radius:8px;padding:.6rem 1.2rem;font-size:.88rem;font-weight:600;font-family:var(--ff-body);text-decoration:none;display:flex;align-items:center">
                Inicio
              </a>
            </div>
          </div>
        `;

        document.getElementById('quiz-bar').style.width = '100%';
        document.getElementById('quiz-counter').textContent = `${shuffled.length} / ${shuffled.length}`;

        // Animate ring
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.querySelector('.ring-fg').style.strokeDashoffset = offset;
          });
        });

        document.getElementById('quiz-retry').addEventListener('click', () => {
          renderQuizCine();
        });
      }

      // Swipe engine
      function setupSwipe(card) {
        let startX = 0, startY = 0, deltaX = 0, isDragging = false, startTime = 0;
        const THRESHOLD = 80;
        const overlayYes = document.getElementById('overlay-yes');
        const overlayNo = document.getElementById('overlay-no');

        function onStart(e) {
          if (answered) return;
          isDragging = true;
          startTime = Date.now();
          const point = e.touches ? e.touches[0] : e;
          startX = point.clientX;
          startY = point.clientY;
          card.style.transition = 'none';
        }

        function onMove(e) {
          if (!isDragging || answered) return;
          const point = e.touches ? e.touches[0] : e;
          deltaX = point.clientX - startX;
          const deltaY = point.clientY - startY;

          // If vertical movement is dominant, don't hijack scroll
          if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaX) < 10) return;
          if (Math.abs(deltaX) > 10) e.preventDefault();

          const rotation = deltaX * 0.08;
          card.style.transform = `translateX(${deltaX}px) rotate(${rotation}deg)`;

          const progress = Math.min(Math.abs(deltaX) / THRESHOLD, 1);
          if (deltaX > 0) {
            overlayYes.style.opacity = progress;
            overlayNo.style.opacity = 0;
            card.classList.add('swiping-right');
            card.classList.remove('swiping-left');
          } else if (deltaX < 0) {
            overlayNo.style.opacity = progress;
            overlayYes.style.opacity = 0;
            card.classList.add('swiping-left');
            card.classList.remove('swiping-right');
          } else {
            overlayYes.style.opacity = 0;
            overlayNo.style.opacity = 0;
          }
        }

        function onEnd() {
          if (!isDragging || answered) return;
          isDragging = false;

          // Velocity-based: allow fast flicks with shorter distance
          const elapsed = Date.now() - startTime;
          const velocity = Math.abs(deltaX) / elapsed;
          const isFlick = velocity > 0.5 && Math.abs(deltaX) > 30;

          if (Math.abs(deltaX) >= THRESHOLD || isFlick) {
            answer(deltaX > 0);
          } else {
            // Snap back
            card.style.transition = 'transform .3s var(--ease-out-quart)';
            card.style.transform = '';
            overlayYes.style.opacity = 0;
            overlayNo.style.opacity = 0;
            card.classList.remove('swiping-right', 'swiping-left');
          }
          deltaX = 0;
        }

        // Touch events
        card.addEventListener('touchstart', onStart, { passive: true });
        card.addEventListener('touchmove', onMove, { passive: false });
        card.addEventListener('touchend', onEnd);

        // Mouse events
        card.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
      }

      // Init
      renderShell();
      showCard();

      // Button handlers
      document.getElementById('btn-no').addEventListener('click', () => answer(false));
      document.getElementById('btn-yes').addEventListener('click', () => answer(true));

      // Keyboard support
      const keyHandler = (e) => {
        if (location.hash !== '#quiz') {
          document.removeEventListener('keydown', keyHandler);
          return;
        }
        if (e.key === 'ArrowLeft') answer(false);
        else if (e.key === 'ArrowRight') answer(true);
      };
      document.addEventListener('keydown', keyHandler);
    }

    /* ── Fuzzy Search Engine ── */
    let SEARCH_INDEX = [];

    function normalize(str) {
      return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function fuzzyScore(query, target) {
      const q = normalize(query), t = normalize(target);
      if (!q) return 0;
      const subIdx = t.indexOf(q);
      if (subIdx === 0) return 10000 + (1000 - t.length);
      if (subIdx > 0) return 5000 + (1000 - subIdx);
      const words = t.split(/\s+/), qWords = q.split(/\s+/);
      let wordScore = 0;
      for (const qw of qWords) for (const tw of words) {
        if (tw.startsWith(qw)) wordScore += 2000;
        else if (tw.includes(qw)) wordScore += 1000;
      }
      if (wordScore > 0) return wordScore;
      let qi = 0, consecutive = 0, score = 0, firstMatch = -1;
      for (let ti = 0; ti < t.length && qi < q.length; ti++) {
        if (t[ti] === q[qi]) {
          if (firstMatch < 0) firstMatch = ti;
          consecutive++;
          score += consecutive * 10 + (ti === 0 ? 50 : 0);
          if (ti === 0 || ' .-_'.includes(t[ti - 1])) score += 30;
          qi++;
        } else { consecutive = 0; }
      }
      if (qi < q.length) return 0;
      return score - firstMatch;
    }

    function buildSearchIndex() {
      SEARCH_INDEX = [];
      const seenDirectors = new Set(), seenSlugs = new Set();
      for (const f of DATA) for (const p of f.personas) for (const m of p.peliculas) {
        const titulo = typeof m === 'string' ? m : m.titulo;
        const slug = typeof m === 'string' ? null : m.slug;
        if (!slug || seenSlugs.has(slug)) continue;
        seenSlugs.add(slug);
        const peli = PELI_CACHE[slug];
        const searchFields = [titulo];
        let sub = `${p.nombre} · Finde #${f.numero}`;
        let poster = null;
        if (peli) {
          if (peli.titulo_original && peli.titulo_original !== titulo) searchFields.push(peli.titulo_original);
          if (peli.titulo_es && peli.titulo_es !== titulo) searchFields.push(peli.titulo_es);
          if (peli.director) { searchFields.push(peli.director); sub = `${peli.director} (${peli.year || '?'}) · ${p.nombre}`; }
          if (peli.genre) searchFields.push(peli.genre);
          if (peli.year) searchFields.push(peli.year);
          poster = peli.poster;
          if (peli.director) for (const d of peli.director.split(', ')) {
            if (!seenDirectors.has(d)) {
              seenDirectors.add(d);
              const dirPelis = [];
              for (const [s, pd] of Object.entries(PELI_CACHE)) {
                if (pd && pd.director && pd.director.includes(d)) dirPelis.push(pd.titulo);
              }
              SEARCH_INDEX.push({ type:'director', label:d, sub:`${dirPelis.length} peli${dirPelis.length>1?'s':''}: ${dirPelis.slice(0,3).join(', ')}${dirPelis.length>3?'…':''}`, search:d, href:`#director/${encodeURIComponent(d)}`, poster:null, boost:1 });
            }
          }
        }
        SEARCH_INDEX.push({ type:'pelicula', label:titulo, sub, search:searchFields.join(' '), href:`#pelicula/${slug}`, poster, boost:3 });
      }
      for (const name of [...new Set(DATA.flatMap(f => f.personas.map(p => p.nombre)))]) {
        const count = DATA.reduce((s, f) => s + (f.personas.some(p => p.nombre === name) ? 1 : 0), 0);
        SEARCH_INDEX.push({ type:'persona', label:name, sub:`${count} findes`, search:name, href:`#persona/${encodeURIComponent(name)}`, poster:null, boost:2 });
      }
      for (const l of [...new Set(DATA.flatMap(f => f.lugares))]) {
        const count = DATA.filter(f => f.lugares.includes(l)).length;
        SEARCH_INDEX.push({ type:'lugar', label:l, sub:`${count} findes`, search:l, href:`#lugar/${encodeURIComponent(l)}`, poster:null, boost:2 });
      }
      const generos = {};
      for (const [slug, p] of Object.entries(PELI_CACHE)) {
        if (!p || !seenSlugs.has(slug)) continue;
        for (const g of genresOf(p)) generos[g] = (generos[g] || 0) + 1;
      }
      for (const [g, n] of Object.entries(generos)) {
        SEARCH_INDEX.push({ type:'genero', label:g, sub:`${n} película${n !== 1 ? 's' : ''}`, search:g, href:`#genero/${encodeURIComponent(g)}`, poster:null, boost:1 });
      }
      for (const f of DATA) {
        SEARCH_INDEX.push({ type:'finde', label:`Finde #${f.numero}`, sub:`${f.fecha} · ${f.lugares.join(', ')}`, search:`Finde ${f.numero} ${f.fecha} ${f.lugares.join(' ')}`, href:`#finde/${f.numero}`, poster:null, boost:1 });
      }
    }

    const SR_LABEL = { pelicula:'Película', persona:'Persona', lugar:'Lugar', finde:'Finde', director:'Director', genero:'Género' };

    /* ── Search UI ── */
    let searchSelectedIdx = -1;

    function setupSearch() {
      const input = document.getElementById('global-search');
      const results = document.getElementById('search-results');
      let debounceTimer;
      input.addEventListener('input', () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => doSearch(input.value), 80); });
      input.addEventListener('keydown', (e) => {
        const items = results.querySelectorAll('.sr-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); searchSelectedIdx = Math.min(searchSelectedIdx + 1, items.length - 1); highlightItem(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); searchSelectedIdx = Math.max(searchSelectedIdx - 1, -1); highlightItem(items); }
        else if (e.key === 'Enter' && searchSelectedIdx >= 0 && items[searchSelectedIdx]) { e.preventDefault(); items[searchSelectedIdx].click(); }
        else if (e.key === 'Escape') { results.classList.remove('open'); input.blur(); }
      });
      document.addEventListener('click', (e) => { if (!e.target.closest('.search-wrap')) results.classList.remove('open'); });
      input.addEventListener('focus', () => { if (input.value.length >= 2) doSearch(input.value); });
    }

    function highlightItem(items) {
      items.forEach((el, i) => el.classList.toggle('selected', i === searchSelectedIdx));
      if (items[searchSelectedIdx]) items[searchSelectedIdx].scrollIntoView({ block: 'nearest' });
    }

    function doSearch(query) {
      const results = document.getElementById('search-results');
      if (query.length < 2) { results.classList.remove('open'); return; }
      const scored = new Map();
      for (const item of SEARCH_INDEX) {
        const labelScore = fuzzyScore(query, item.label) * item.boost * 2;
        const fullScore = fuzzyScore(query, item.search) * item.boost;
        const score = Math.max(labelScore, fullScore);
        if (score > 0) {
          const existing = scored.get(item.href);
          if (!existing || score > existing.score) scored.set(item.href, { ...item, score });
        }
      }
      const matches = [...scored.values()].sort((a, b) => b.score - a.score).slice(0, 15);
      searchSelectedIdx = -1;
      if (matches.length === 0) {
        results.innerHTML = '<div style="padding:.85rem;color:var(--tx-3);font-size:.88rem">Sin resultados</div>';
        results.classList.add('open');
        return;
      }
      results.innerHTML = matches.map((m, i) => {
        const posterHtml = m.poster
          ? `<img src="${posterUrl(m.poster, POSTER.xs)}" alt="" loading="lazy">`
          : `<div class="sr-placeholder">${ico({pelicula:'film',persona:'persona',lugar:'lugar',finde:'fecha',director:'camara',genero:'genero'}[m.type] || 'film')}</div>`;
        return `<div class="sr-item" data-href="${m.href}" data-idx="${i}">
          ${posterHtml}
          <div class="sr-text"><div class="sr-title">${highlightMatch(m.label, query)}</div><div class="sr-sub">${m.sub}</div></div>
          <span class="sr-type ${m.type}">${SR_LABEL[m.type] || m.type}</span>
        </div>`;
      }).join('');
      results.classList.add('open');
      results.querySelectorAll('.sr-item').forEach(el => {
        el.addEventListener('click', () => { location.hash = el.dataset.href; results.classList.remove('open'); document.getElementById('global-search').value = ''; });
      });
    }

    function highlightMatch(text, query) {
      const q = normalize(query), tNorm = normalize(text);
      const idx = tNorm.indexOf(q);
      if (idx >= 0) return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
      let result = '', qi = 0;
      for (let i = 0; i < text.length; i++) {
        if (qi < q.length && normalize(text[i]) === q[qi]) { result += '<mark>' + text[i] + '</mark>'; qi++; }
        else result += text[i];
      }
      return result;
    }

    init();
  </script>
</body>
